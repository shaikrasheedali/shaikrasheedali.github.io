const readWebPFile=async(file)=>{
  if(!file)throw new Error("No file selected.");
  const bitmap=await createImageBitmap(file);
  const ratio=Math.min(1,1400/bitmap.width,1400/bitmap.height);
  const canvas=document.createElement("canvas");
  canvas.width=Math.round(bitmap.width*ratio);
  canvas.height=Math.round(bitmap.height*ratio);
  canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
  bitmap.close();
  return{id:uid(),name:file.name.replace(/\.[^.]+$/,"")+".webp",format:"WebP",size:Math.round(file.size/1024*0.32)+" KB",saved:"68%",src:canvas.toDataURL("image/webp",0.8)};
};

const useIcons=(dep)=>{useEffect(()=>{window.lucide&&window.lucide.createIcons({attrs:{"stroke-width":1.8}})},[dep])};
const useAnimations=(dep)=>{
  useEffect(()=>{
    if(!window.gsap||!window.ScrollTrigger)return;
    gsap.registerPlugin(ScrollTrigger);
    let lenis,frame;
    if(window.Lenis){
      lenis=new Lenis({duration:1.05,smoothWheel:true});
      const raf=(t)=>{lenis.raf(t);frame=requestAnimationFrame(raf)};
      frame=requestAnimationFrame(raf);
      lenis.on("scroll",ScrollTrigger.update);
    }
    const ctx=gsap.context(()=>{
      gsap.from(".hero-reveal",{y:28,opacity:0,duration:.75,stagger:.09,ease:"power3.out"});
      gsap.utils.toArray(".reveal").forEach((el)=>gsap.from(el,{scrollTrigger:{trigger:el,start:"top 90%"},y:28,opacity:0,duration:.6,ease:"power3.out"}));
    });
    return()=>{ctx.revert();cancelAnimationFrame(frame);lenis&&lenis.destroy()};
  },[dep]);
};

/* AUTO-SLIDING 4:3 CAROUSEL COMPONENT FOR DETAIL PAGES */
const DetailCarousel=({imagesList=[],alt=""})=>{
  const valid=(imagesList||[]).map((x)=>typeof x==="string"?x:x?.src).filter(Boolean);
  const [idx,setIdx]=useState(0);
  useEffect(()=>{
    if(valid.length<=1)return;
    const timer=setInterval(()=>setIdx((p)=>(p+1)%valid.length),4500);
    return()=>clearInterval(timer);
  },[valid.length]);
  if(!valid.length)return null;
  const current=valid[Math.min(idx,valid.length-1)];
  return (
    <div className="detail-carousel">
      <img src={safeURL(current,true)} alt={alt}/>
      {valid.length>1&&(
        <div className="carousel-dots">
          {valid.map((_,i)=>(
            <button key={i} type="button" className={"carousel-dot "+(i===idx?"active":"")} onClick={()=>setIdx(i)} aria-label={"Slide "+(i+1)}/>
          ))}
        </div>
      )}
    </div>
  );
};

/* 7. MS WORD-CLASS WYSIWYG DOCUMENT EDITOR & UNIFIED COLLECTION CRUD MANAGER (SCREENSHOTS 1 & 2) */
const MsWordEditor=({value,onChange})=>{
  const surfaceRef=useRef(null);
  const [htmlMode,setHtmlMode]=useState(false);
  useIcons("ms-"+htmlMode);

  useEffect(()=>{
    if(!htmlMode&&surfaceRef.current&&surfaceRef.current.innerHTML!==value){
      surfaceRef.current.innerHTML=value||"<p></p>";
    }
  },[htmlMode,value]);

  const exec=(cmd,arg=null)=>{
    if(htmlMode)return;
    surfaceRef.current?.focus();
    document.execCommand(cmd,false,arg);
    onChange(surfaceRef.current?.innerHTML||"");
  };

  return (
    <div className="ms-word-box">
      <div className="ms-toolbar">
        <button type="button" className="ms-tool-btn" title="Undo" onClick={()=>exec("undo")}><Icon name="undo-2" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Redo" onClick={()=>exec("redo")}><Icon name="redo-2" size={14}/></button>
        <span className="ms-sep"/>
        <select onChange={(e)=>exec("formatBlock",e.target.value)} defaultValue="P" aria-label="Text Block">
          <option value="P">Paragraph</option>
          <option value="H2">Heading 2</option>
          <option value="H3">Heading 3</option>
          <option value="H4">Heading 4</option>
          <option value="BLOCKQUOTE">Blockquote</option>
        </select>
        <select onChange={(e)=>exec("fontName",e.target.value)} defaultValue="DM Sans" aria-label="Font Family">
          <option value="DM Sans">DM Sans</option>
          <option value="Plus Jakarta Sans">Plus Jakarta Sans</option>
          <option value="Manrope">Manrope</option>
          <option value="Georgia">Georgia</option>
        </select>
        <select onChange={(e)=>exec("fontSize",e.target.value)} defaultValue="3" aria-label="Font Size">
          <option value="2">14px</option>
          <option value="3">16px</option>
          <option value="4">18px</option>
          <option value="5">24px</option>
        </select>
        <span className="ms-sep"/>
        <button type="button" className="ms-tool-btn" title="Bold" onClick={()=>exec("bold")}><b>B</b></button>
        <button type="button" className="ms-tool-btn" title="Italic" onClick={()=>exec("italic")}><i>I</i></button>
        <button type="button" className="ms-tool-btn" title="Underline" onClick={()=>exec("underline")}><u>U</u></button>
        <button type="button" className="ms-tool-btn" title="Strikethrough" onClick={()=>exec("strikeThrough")}><s>S</s></button>
        <button type="button" className="ms-tool-btn" title="Text Color Cobalt" onClick={()=>exec("foreColor","#0042CC")}><span style={{color:"#0042CC",fontWeight:800}}>T▪</span></button>
        <button type="button" className="ms-tool-btn" title="Highlight Soft Yellow" onClick={()=>exec("hiliteColor","#FEF08A")}><span style={{background:"#FEF08A",padding:"0 4px",borderRadius:3}}>A▪</span></button>
        <span className="ms-sep"/>
        <button type="button" className="ms-tool-btn" title="Align Left" onClick={()=>exec("justifyLeft")}><Icon name="align-left" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Align Center" onClick={()=>exec("justifyCenter")}><Icon name="align-center" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Align Right" onClick={()=>exec("justifyRight")}><Icon name="align-right" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Justify" onClick={()=>exec("justifyFull")}><Icon name="align-justify" size={14}/></button>
        <span className="ms-sep"/>
        <button type="button" className="ms-tool-btn" title="Bulleted List" onClick={()=>exec("insertUnorderedList")}><Icon name="list" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Numbered List" onClick={()=>exec("insertOrderedList")}><Icon name="list-ordered" size={14}/></button>
        <span className="ms-sep"/>
        <button type="button" className="ms-tool-btn" title="Insert Table" onClick={()=>exec("insertHTML",`<table style="width:100%;border-collapse:collapse;margin:12px 0;" border="1"><tr><th style="padding:8px">Parameter</th><th style="padding:8px">Specification</th></tr><tr><td style="padding:8px">Availability</td><td style="padding:8px">24/7</td></tr></table>`)}><Icon name="table" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Insert Link" onClick={()=>{const u=prompt("Enter HTTPS URL:");if(u)exec("createLink",u)}}><Icon name="link" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Insert Image URL" onClick={()=>{const u=prompt("Enter Image URL:");if(u)exec("insertImage",u)}}><Icon name="image" size={14}/></button>
        <button type="button" className="ms-tool-btn" title="Blockquote" onClick={()=>exec("formatBlock","BLOCKQUOTE")}><Icon name="quote" size={14}/></button>

const CollectionCrudManager=({config,items,onSaveItems,mediaLibrary,onAddMediaAsset,notify})=>{
  const [search,setSearch]=useState("");
  const [editingItem,setEditingItem]=useState(null);
  const [isNew,setIsNew]=useState(false);
  const [mediaModal,setMediaModal]=useState(false);
  useIcons(config.key+(editingItem?.id||"list")+mediaModal);

  const openEditor=(item,createNew=false)=>{
    const rawImgs=item.images?.length?item.images.map((x)=>typeof x==="string"?x:x.src):[item.src||item.img||images.hero].filter(Boolean);
    setIsNew(createNew);
    setEditingItem({
      ...item,
      id:item.id||uid(),
      title:item.title||item.name||"",
      slug:item.slug||slugify(item.title||item.name||""),
      category:item.category||item.role||item.department||item.specialty||"General",
      status:item.status||"Published",
      desc:item.desc||item.excerpt||item.exp||"",
      html:item.html||`<p>${item.overview||item.bio||item.desc||"Suraksha Hospital's campus is purpose-built to provide a welcoming, serene, and clinically sterile environment. Features centralized air-handling units, dedicated 24/7 triage, and seamless digital registration desks."}</p>`,
      images:rawImgs
    });
  };

  const handleSaveEditor=(e)=>{
    e.preventDefault();
    if(!editingItem.title.trim()){notify("Item Title is required.");return}
    const cleanSlug=editingItem.slug.trim()?slugify(editingItem.slug):slugify(editingItem.title);
    const primaryImg=editingItem.images[0]||images.hero;
    const finalItem={
      ...editingItem,
      name:editingItem.title,
      title:editingItem.title,
      slug:cleanSlug,
      src:primaryImg,
      img:primaryImg,
      excerpt:editingItem.desc,
      exp:editingItem.exp||editingItem.desc,
      role:config.key==="doctors"?editingItem.category:editingItem.role,
      specialty:config.key==="journal"?editingItem.category:editingItem.specialty
    };
    const nextList=isNew?[finalItem,...items]:items.map((x)=>(x.id===finalItem.id||x.slug===editingItem.slug)?finalItem:x);
    onSaveItems(nextList);
    setEditingItem(null);
    notify(`${config.singular} "${finalItem.title}" saved & published!`);
  };

  /* IF EDITING OR CREATING AN ITEM -> RENDER EXACT SCREENSHOT 2 EDITOR VIEW */
  if(editingItem){
    return (
      <form className="item-editor-wrap" onSubmit={handleSaveEditor}>
        <div className="item-editor-top">
          <h1>{isNew?`Create ${config.singular}`:`Edit ${config.singular}: ${editingItem.title||"Untitled"}`}</h1>
          <button type="button" className="editor-close-btn" onClick={()=>setEditingItem(null)} title="Close Editor"><Icon name="x" size={16}/></button>
        </div>

        <div className="editor-form-row">
          <div className="editor-field">
            <label>ITEM TITLE <span className="req">*</span></label>
            <input required value={editingItem.title} onChange={(e)=>setEditingItem({...editingItem,title:e.target.value,slug:isNew?slugify(e.target.value):editingItem.slug})} placeholder={`Enter ${config.singular.toLowerCase()} title...`}/>
          </div>
          <div className="editor-field">
            <label>URL SLUG (AUTO-GENERATED IF EMPTY)</label>
            <input value={editingItem.slug} onChange={(e)=>setEditingItem({...editingItem,slug:e.target.value})} placeholder={slugify(editingItem.title||"item-slug")}/>
          </div>
        </div>

        <div className="editor-form-row">
          <div className="editor-field">
            <label>CATEGORY</label>
            <input value={editingItem.category} onChange={(e)=>setEditingItem({...editingItem,category:e.target.value})} placeholder="e.g. Neurosurgery, Intensive Care, General"/>
          </div>
          <div className="editor-field">
            <label>PUBLICATION STATUS</label>
            <select value={editingItem.status} onChange={(e)=>setEditingItem({...editingItem,status:e.target.value})}>
              <option value="Published">Published</option>
              <option value="Draft">Draft</option>
            </select>
          </div>
        </div>

        <div className="hero-assets-box">
          <div className="hero-assets-head">
            <div>
              <strong>HERO IMAGE(S) & MEDIA ASSETS</strong>
              <small>Attach one or multiple images or videos. Multiple assets display as an auto-sliding 4:3 carousel with generous timer on detail pages.</small>
            </div>
            <div className="hero-assets-actions">
              <button type="button" className="btn-pick-media" onClick={()=>setMediaModal(true)}>
                <Icon name="image" size={15}/> Pick from Media Assets
              </button>
              <label className="btn-upload-webp">
                <Icon name="upload" size={15}/> Upload WebP
                <input type="file" accept="image/*" style={{display:"none"}} onChange={async(ev)=>{
                  const file=ev.target.files?.[0];
                  if(!file)return;
                  try{
                    const asset=await readWebPFile(file);
                    onAddMediaAsset(asset);
                    setEditingItem((prev)=>({...prev,images:[...prev.images,asset.src]}));
                    notify("Uploaded & converted to WebP ("+asset.size+")");
                  }catch(err){notify(err.message)}
                  ev.target.value="";
                }}/>
              </label>
            </div>
          </div>

          <div className="attached-assets-grid">
            {editingItem.images.map((imgSrc,idx)=>(
              <div className="attached-thumb-card" key={idx}>
                <img src={safeURL(imgSrc,true)} alt={"Asset "+(idx+1)}/>
                <button type="button" className="thumb-remove-btn" onClick={()=>setEditingItem({...editingItem,images:editingItem.images.filter((_,i)=>i!==idx)})} title="Remove Asset">✕</button>
                <span className="thumb-index-badge">#{idx+1}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="editor-field" style={{marginBottom:22}}>
          <label>SHORT SUMMARY / EXCERPT</label>
          <textarea value={editingItem.desc} onChange={(e)=>setEditingItem({...editingItem,desc:e.target.value})} placeholder="Brief clinical summary displayed on cards and search listings..."/>
        </div>

        <div className="doc-editor-header">
          <label>DETAILED CONTENT DOCUMENT</label>
          <span>RICH WYSIWYG DOCUMENT EDITOR (MS WORD FEATURES ENABLED)</span>
        </div>
        <MsWordEditor value={editingItem.html} onChange={(html)=>setEditingItem({...editingItem,html})}/>

        <div style={{display:"flex",justifyContent:"flex-end",gap:12,marginTop:28,paddingTop:20,borderTop:"1px solid #E2EDF5"}}>
          <button type="button" className="btn btn-light" onClick={()=>setEditingItem(null)}>Cancel</button>
          <button type="submit" className="btn btn-cobalt"><Icon name="check" size={16}/> Save & Publish {config.singular}</button>
        </div>

        {mediaModal&&(
          <div className="modal-backdrop" onMouseDown={(e)=>e.target===e.currentTarget&&setMediaModal(false)}>
            <div className="modal" style={{width:"min(720px,100%)"}}>
              <button type="button" className="round-btn modal-close" onClick={()=>setMediaModal(false)}><Icon name="x"/></button>
              <div className="eyebrow">Centralized WebP Repository</div>
              <h3>Pick from Media Assets</h3>
              <p style={{fontSize:13}}>Click any optimized WebP asset below to attach it to this item's 4:3 hero carousel.</p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginTop:18}}>
                {mediaLibrary.map((m)=>(
                  <div key={m.id} onClick={()=>{setEditingItem({...editingItem,images:[...editingItem.images,m.src]});setMediaModal(false);notify("Attached "+m.name)}} style={{border:"1px solid var(--line)",borderRadius:12,overflow:"hidden",cursor:"pointer",background:"var(--paper)"}}>
                    <img src={safeURL(m.src,true)} alt={m.name} style={{width:"100%",height:110,objectFit:"cover"}}/>
                    <div style={{padding:9}}>
                      <strong style={{fontSize:11.5,display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.name}</strong>
                      <span style={{fontSize:10.5,color:"var(--muted)"}}>{m.format} · {m.size}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </form>
    );
  }

  /* DEFAULT COLLECTION LIST TABLE VIEW -> RENDER EXACT SCREENSHOT 1 DESIGN */
  const filtered=items.filter((x)=>
    (x.title||x.name||"").toLowerCase().includes(search.toLowerCase())||
    (x.slug||"").toLowerCase().includes(search.toLowerCase())||
    (x.category||x.role||"").toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div className="collection-header">
        <div>
          <span className="collection-eyebrow">DATABASE CONTENT MANAGEMENT</span>
          <h1>{config.heading}</h1>
          <p>{config.subtitle}</p>
        </div>
        <button type="button" className="btn-add-collection" onClick={()=>openEditor({title:"",slug:"",category:"General",status:"Published",desc:"",html:"<p></p>",images:[images.hero]},true)}>
          <Icon name="plus" size={17}/> Add New {config.singular}
        </button>
      </div>

      <div className="collection-card">
        <div className="collection-toolbar">
          <div className="collection-search">
            <Icon name="search" size={16}/>
            <input value={search} onChange={(e)=>setSearch(e.target.value)} placeholder={`Search ${config.heading.toLowerCase()}...`}/>
          </div>
          <button type="button" className="btn-refresh" onClick={()=>{setSearch("");notify(`Refreshed ${config.heading}`)}} title="Refresh Collection">
            <Icon name="refresh-cw" size={16}/>
          </button>
        </div>

        <div className="dash-table-wrap">
          <table className="collection-table">
            <thead>
              <tr>
                <th>ITEM & MEDIA</th>
                <th>CATEGORY / DEPARTMENT</th>
                <th>STATUS</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((item,idx)=>{
                const title=item.title||item.name||"Untitled";
                const slug=item.slug||slugify(title);
                const thumb=item.src||item.img||(item.images&&item.images[0]&&(typeof item.images[0]==="string"?item.images[0]:item.images[0].src))||images.hero;
                const cat=item.category||item.role||item.department||item.specialty||"General";
                const status=item.status||"Published";
                return (
                  <tr key={item.id||slug||idx}>
                    <td>
                      <div className="item-media-cell">
                        <img className="item-thumb" src={safeURL(thumb,true)} alt={title}/>
                        <div>
                          <strong className="item-title-text">{title}</strong>
                          <span className="item-slug-text">slug: /{config.routePrefix}/{slug}</span>
                        </div>
                      </div>
                    </td>
                    <td><span className="item-cat-text">{cat}</span></td>
                    <td><span className={"status-pill "+(status.toLowerCase()==="draft"?"draft":"")}>{status}</span></td>
                    <td>
                      <div className="action-btn-group">
                        <button type="button" className="act-btn view" title="Preview Live Page" onClick={()=>{location.hash=`#/${config.routePrefix}/${slug}`}}>
                          <Icon name="eye" size={15}/>
                        </button>
                        <button type="button" className="act-btn edit" title={`Edit ${title}`} onClick={()=>openEditor(item,false)}>
                          <Icon name="pencil" size={15}/>
                        </button>
                        <button type="button" className="act-btn del" title={`Delete ${title}`} onClick={()=>{
                          if(confirm(`Delete "${title}" from ${config.heading}?`)){
                            onSaveItems(items.filter((_,i)=>i!==idx));
                            notify(`Deleted "${title}"`);
                          }
                        }}>
                          <Icon name="trash-2" size={15}/>
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

          <BrandLogo height={42}/>
          <div className="brand-copy">
            <strong style={{fontSize:16,color:"#fff"}}>Suraksha</strong>
            <small style={{color:"var(--sky-light)",fontSize:9.5}}>EMERGENCY & MULTI-SPECIALTY</small>
          </div>
        </div>
        <div className="sidebar-nav">
          {sidebarSections.map((sec,idx)=>(
            <React.Fragment key={idx}>
              {sec.heading&&<div className="side-section-label">{sec.heading}</div>}
              {sec.items.map(([id,ic,label])=>(
                <button key={id} className={"side-link "+(tab===id?"active":"")} onClick={()=>{setTab(id);setMobile(false)}}>
                  <Icon name={ic} size={17}/>
                  <span>{label}</span>
                </button>
              ))}
            </React.Fragment>
          ))}
        </div>
        <div className="side-footer">
          <button className="side-link" onClick={onExit}><Icon name="external-link" size={17}/><span>View Live Website</span></button>
          <button className="side-link" onClick={onExit}><Icon name="log-out" size={17}/><span>Sign Out</span></button>
        </div>
        <div className="user-mini">
          <div className="user-avatar">{user.short||"SU"}</div>
          <div>
            <strong>{user.name||"superadmin"}</strong>
            <span>{user.label||"Superadmin"}</span>
          </div>
        </div>
      </aside>

      <main className="dash-main">
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <button className="round-btn mobile-dash-menu" onClick={()=>setMobile(!mobile)}><Icon name="menu"/></button>
        </div>

        {tab==="overview"&&(
          <>
            <div className="collection-header">
              <div>
                <span className="collection-eyebrow">REAL-TIME CLINICAL TELEMETRY</span>
                <h1>Analytics & Platform Overview</h1>
                <p>Monitor patient sessions, 24/7 emergency helpline conversions, and department inquiries.</p>
              </div>
              <button className="btn-add-collection" onClick={()=>setTab("facilities")}><Icon name="layers" size={16}/> Manage Collections</button>
            </div>
            <OverviewAnalytics appointments={appointments} enquiries={enquiries} cms={cms} doctors={doctors} blogs={blogs} setTab={setTab}/>
          </>
        )}

        {tab==="facilities"&&(
          <CollectionCrudManager
            config={collectionConfigs.facilities}
            items={cms.facilities}
            onSaveItems={(next)=>{const updated={...cms,facilities:next};setCms(updated);saveStore("suraksha-cms",updated,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="specialties"&&(
          <CollectionCrudManager
            config={collectionConfigs.specialties}
            items={cms.services}
            onSaveItems={(next)=>{const updated={...cms,services:next};setCms(updated);saveStore("suraksha-cms",updated,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="treatments"&&(
          <CollectionCrudManager
            config={collectionConfigs.treatments}
            items={cms.treatments||treatmentSeed}
            onSaveItems={(next)=>{const updated={...cms,treatments:next};setCms(updated);saveStore("suraksha-cms",updated,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="doctors"&&(
          <CollectionCrudManager
            config={collectionConfigs.doctors}
            items={doctors}
            onSaveItems={(next)=>{setDoctors(next);saveStore("suraksha-doctors",next,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="gallery"&&(
          <CollectionCrudManager
            config={collectionConfigs.gallery}
            items={cms.gallery||gallerySeed}
            onSaveItems={(next)=>{const updated={...cms,gallery:next};setCms(updated);saveStore("suraksha-cms",updated,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="journal"&&(
          <CollectionCrudManager
            config={collectionConfigs.journal}
            items={blogs}
            onSaveItems={(next)=>{setBlogs(next);saveStore("suraksha-blogs",next,notify)}}
            mediaLibrary={cms.mediaLibrary||mediaLibrarySeed}
            onAddMediaAsset={addMediaAsset}
            notify={notify}
          />
        )}

        {tab==="media"&&(
          <div>
            <div className="collection-header">
              <div>
                <span className="collection-eyebrow">CENTRALIZED WEBP / WEBM REPOSITORY</span>
                <h1>Media Assets Library</h1>
                <p>Upload images to automatically optimize and convert them to WebP for any collection item.</p>
              </div>
              <label className="btn-add-collection" style={{cursor:"pointer"}}>
                <Icon name="upload" size={17}/> Upload & Convert to WebP
                <input type="file" accept="image/*" style={{display:"none"}} onChange={async(e)=>{
                  const f=e.target.files?.[0];
                  if(!f)return;
                  try{
                    const asset=await readWebPFile(f);
                    addMediaAsset(asset);
                    notify("Uploaded & converted "+asset.name);
                  }catch(err){notify(err.message)}
                  e.target.value="";
                }}/>
              </label>
            </div>
            <div className="collection-card" style={{padding:26}}>
              <div className="services-grid">
                {(cms.mediaLibrary||mediaLibrarySeed).map((m)=>(
                  <div className="admin-section" key={m.id} style={{marginBottom:0}}>
                    <img src={safeURL(m.src,true)} alt={m.name} style={{width:"100%",height:160,objectFit:"cover",borderRadius:10,marginBottom:12}}/>
                    <strong style={{display:"block",fontSize:14}}>{m.name}</strong>
                    <span style={{fontSize:12,color:"var(--muted)"}}>{m.format} · {m.size} ({m.saved} saved)</span>
                    <div style={{marginTop:10,display:"flex",gap:8}}>
                      <button className="tiny-btn" onClick={()=>{navigator.clipboard?.writeText(m.src);notify("Copied URL for "+m.name)}}>Copy Asset URL</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab==="appointments"&&(
          <div>
            <div className="collection-header">
              <div>
                <span className="collection-eyebrow">PATIENT OPERATIONS</span>
                <h1>OPD Appointments Lead Board</h1>
                <p>Manage incoming patient consultation requests and emergency triage callbacks.</p>
              </div>
            </div>
            <div className="collection-card">
              <div className="dash-table-wrap">
                <table className="collection-table">
                  <thead><tr><th>PATIENT</th><th>REF ID</th><th>SPECIALTY</th><th>PREFERRED DATE</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
                  <tbody>
                    {appointments.map((a,idx)=>(
                      <tr key={a.id}>
                        <td><strong className="item-title-text">{a.name}</strong><span className="item-slug-text">{a.phone||"+91 70754 47449"}</span></td>
                        <td>{a.id}</td>
                        <td>{a.service}</td>
                        <td>{a.date}</td>
                        <td>
                          <select className="status-pill" value={a.status} onChange={(e)=>{const next=appointments.map((x,i)=>i===idx?{...x,status:e.target.value}:x);setAppointments(next);notify("Status updated to "+e.target.value)}}>
                            <option>Confirmed</option><option>Pending</option><option>Cancelled</option>
                          </select>
                        </td>
                        <td>
                          <div className="action-btn-group">
                            <a href={"tel:"+(a.phone||"+917075447449").replace(/\s/g,"")} className="act-btn edit" title="Call Patient"><Icon name="phone" size={14}/></a>
                            <button type="button" className="act-btn del" title="Delete" onClick={()=>{setAppointments(appointments.filter((_,i)=>i!==idx));notify("Appointment removed")}}><Icon name="trash-2" size={14}/></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {tab==="enquiries"&&(
          <div>
            <div className="collection-header">
              <div>
                <span className="collection-eyebrow">PATIENT OPERATIONS</span>
                <h1>Contact Enquiries</h1>
                <p>Respond to website contact messages, cashless insurance queries, and OPD questions.</p>
              </div>
            </div>
            <div className="collection-card">
              <div className="dash-table-wrap">
                <table className="collection-table">
                  <thead><tr><th>SENDER</th><th>SUBJECT / MESSAGE</th><th>RECEIVED</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
                  <tbody>
                    {enquiries.map((eq,idx)=>(
                      <tr key={eq.id}>
                        <td><strong className="item-title-text">{eq.name}</strong><span className="item-slug-text">{eq.phone}</span></td>
                        <td>{eq.subject}</td>
                        <td>{eq.received}</td>
                        <td>
                          <select className="status-pill" value={eq.status} onChange={(e)=>{const next=enquiries.map((x,i)=>i===idx?{...x,status:e.target.value}:x);setEnquiries(next);notify("Enquiry marked "+e.target.value)}}>
                            <option>Unresolved</option><option>Contacted</option><option>Resolved</option>
                          </select>
                        </td>
                        <td>
                          <a href={"https://wa.me/"+eq.phone.replace(/[^\d]/g,"")} target="_blank" rel="noopener noreferrer" className="tiny-btn">WhatsApp</a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {tab==="settings"&&(
          <div className="item-editor-wrap">
            <div className="item-editor-top">
              <div>
                <span className="collection-eyebrow">SYSTEM & SETTINGS</span>
                <h1>Hospital Settings & Favicon (`./logo.svg`)</h1>
              </div>
              <button className="btn btn-cobalt" onClick={()=>{saveStore("suraksha-cms",cms,notify);notify("Hospital settings saved!")}}>Save Settings</button>
            </div>
            <div className="hero-assets-box" style={{display:"flex",alignItems:"center",gap:18}}>
              <BrandLogo height={56}/>
              <div>
                <strong>ACTIVE BRAND LOGO & FAVICON: `./logo.svg`</strong>
                <small>Automatically loaded across the Top-Left Navbar, Admin Sidebar, Login Portal, and Website Footer.</small>
              </div>
            </div>
            <div className="editor-form-row">
              <div className="editor-field"><label>24/7 EMERGENCY HELPLINE</label><input value={cms.facts.phone} onChange={(e)=>setCms({...cms,facts:{...cms.facts,phone:e.target.value}})}/></div>
              <div className="editor-field"><label>OFFICIAL EMAIL</label><input value={cms.facts.email} onChange={(e)=>setCms({...cms,facts:{...cms.facts,email:e.target.value}})}/></div>
              <div className="editor-field"><label>HOSPITAL ADDRESS (KHAMMAM)</label><input value={cms.facts.address} onChange={(e)=>setCms({...cms,facts:{...cms.facts,address:e.target.value}})}/></div>
              <div className="editor-field"><label>OPERATING & OPD HOURS</label><input value={cms.facts.hours} onChange={(e)=>setCms({...cms,facts:{...cms.facts,hours:e.target.value}})}/></div>
            </div>
          </div>
        )}

        {tab==="users"&&(
          <div>
            <div className="collection-header">
              <div><span className="collection-eyebrow">SYSTEM & SETTINGS</span><h1>Users & Roles</h1><p>Role-Based Access Control (RBAC) for hospital administrators and OPD desk staff.</p></div>
            </div>
            <div className="collection-card">
              <table className="collection-table">
                <thead><tr><th>USER</th><th>ROLE</th><th>EMAIL</th><th>STATUS</th></tr></thead>
                <tbody>
                  {demoAccounts.map((u)=>(
                    <tr key={u.email}>
                      <td><div className="item-media-cell"><div className="user-avatar">{u.short}</div><strong className="item-title-text">{u.name}</strong></div></td>
                      <td>{u.label}</td>
                      <td>{u.email}</td>
                      <td><span className="status-pill">Active</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab==="audit"&&(
          <div>
            <div className="collection-header">
              <div><span className="collection-eyebrow">SYSTEM & SETTINGS</span><h1>Audit Logs</h1><p>Immutable activity log of content edits, doctor schedule updates, and system changes.</p></div>
            </div>
            <div className="collection-card">
              <table className="collection-table">
                <thead><tr><th>TIMESTAMP</th><th>ACTOR</th><th>ACTION</th><th>MODULE</th></tr></thead>
                <tbody>
                  <tr><td>2026-10-15 10:12 AM</td><td><strong>superadmin (SU)</strong></td><td>Verified `./logo.svg` brand identity & favicon</td><td>Hospital Settings</td></tr>
                  <tr><td>2026-10-15 09:45 AM</td><td><strong>superadmin (SU)</strong></td><td>Updated Multi-Specialty Hospital Infrastructure & Reception</td><td>Facilities</td></tr>
                  <tr><td>2026-10-14 06:20 PM</td><td><strong>opddesk (OP)</strong></td><td>Confirmed OPD Appointment `SRK-2048`</td><td>Appointments</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        )}
      </main>
    </div>
  );
};

/* 9. ROOT ROUTER & APPLICATION STATE (ARROW FUNCTION) */
const App=()=>{
  const [user,setUser]=useState(demoAccounts[0]);
  const [lang,setLang]=useState("en");
  const [routeObj,setRouteObj]=useState(()=>parseRoute(location.hash));
  const [cms,setCms]=useState(()=>hydrateCMS(loadStore("suraksha-cms",{})));
  const [doctors,setDoctors]=useState(()=>loadStore("suraksha-doctors",doctorSeed));
  const [blogs,setBlogs]=useState(()=>loadStore("suraksha-blogs",initialBlogs));
  const [appointments,setAppointments]=useState(appointmentSeed);
  const [enquiries,setEnquiries]=useState(enquirySeed);
  const [bookingService,setBookingService]=useState(null);
  const [toast,setToast]=useState("");

  const notify=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),3000)};

  useEffect(()=>{
    const onHash=()=>{
      const parsed=parseRoute(location.hash);
      setRouteObj(parsed);
      window.scrollTo(0,0);
    };
    addEventListener("hashchange",onHash);
    return()=>removeEventListener("hashchange",onHash);
  },[]);

  useAnimations(routeObj.page+"/"+routeObj.slug);

  if(routeObj.page==="admin"||(routeObj.page==="dashboard"&&!user)){
    return (
      <>
        <Login onBack={()=>{location.hash="#/"}} onLogin={(acc)=>{setUser(acc);location.hash="#/dashboard"}} notify={notify}/>
        {toast&&<div className="toast"><span className="toast-dot"></span>{toast}</div>}
      </>
    );
  }

  if(routeObj.page==="dashboard"&&user){
    return (
      <>
        <Dashboard user={user} blogs={blogs} setBlogs={setBlogs} cms={cms} setCms={setCms} doctors={doctors} setDoctors={setDoctors} appointments={appointments} setAppointments={setAppointments} enquiries={enquiries} setEnquiries={setEnquiries} onExit={()=>{location.hash="#/"}} notify={notify}/>
        {toast&&<div className="toast"><span className="toast-dot"></span>{toast}</div>}
      </>
    );
  }

  return (
    <div>
      <PublicHeader cms={cms} lang={lang} setLang={setLang} activePage={routeObj.page} onBook={(srv)=>setBookingService(srv??"")} notify={notify}/>
      <main>
        {routeObj.page==="home"&&<HomePage cms={cms} lang={lang} doctors={doctors} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="about-us"&&<AboutPage cms={cms} doctors={doctors} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="specialties"&&<SpecialtiesPage cms={cms} doctors={doctors} slug={routeObj.slug} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="doctors"&&<DoctorsPage cms={cms} doctors={doctors} slug={routeObj.slug} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="facilities"&&<FacilitiesPage cms={cms} slug={routeObj.slug} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="insurance"&&<InsurancePage cms={cms} slug={routeObj.slug} onBook={(srv)=>setBookingService(srv??"")}/>}
        {routeObj.page==="contact"&&<ContactPage cms={cms} onBook={(srv)=>setBookingService(srv??"")} onEnquire={(eq)=>setEnquiries([{id:"ENQ-"+Math.floor(100+Math.random()*900),name:eq.name,phone:eq.phone,subject:eq.subject,received:"Just now",status:"Unresolved"},...enquiries])} notify={notify}/>}
        {routeObj.page==="insights"&&<InsightsPage blogs={blogs} cms={cms} slug={routeObj.slug} onBook={(srv)=>setBookingService(srv??"")}/>}
      </main>
      <PublicFooter cms={cms} notify={notify}/>
      {bookingService!==null&&(
        <BookingModal services={cms.services} initialService={bookingService} onClose={()=>setBookingService(null)} onBook={(data)=>{
          const id="SRK-"+Math.floor(1000+Math.random()*9000);
          setAppointments([{id,name:data.name,phone:data.phone,service:data.service,date:data.date,status:"Pending"},...appointments]);
          setBookingService(null);
          notify("OPD Appointment Request ("+id+") logged! For emergencies call +91 70754 47449.");
        }}/>
      )}
      {toast&&<div className="toast" role="status"><span className="toast-dot"></span>{toast}</div>}
      <div className="noise"></div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
