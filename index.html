const Ctx = createContext(null);

const PAGE_NAMES = { "/": "Home", "/projects": "Projects", "/services": "Services", "/studio": "Studio", "/contact": "Contact" };
const nameFor = (p) => PAGE_NAMES[p] || (p.startsWith("/projects/") ? "Project" : "Ezy");

function AppProvider({ children }) {
  const navigate = useNavigate();
  const location = useLocation();
  const [ready, setReady] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [label, setLabel] = useState("");
  const overlay = useRef(null);
  const labelRef = useRef(null);
  const pending = useRef(null);
  const pathRef = useRef(location.pathname);
  pathRef.current = location.pathname;

  const go = useCallback((to) => {
    if (to === pathRef.current || pending.current) return;
    pending.current = to;
    setLabel(nameFor(to));
    setReady(false);
    const panels = overlay.current.querySelectorAll(".tp");
    gsap.set(overlay.current, { pointerEvents: "auto" });
    gsap.timeline()
      .set(panels, { transformOrigin: "bottom", scaleY: 0 })
      .to(panels, { scaleY: 1, duration: 0.75, ease: "hop", stagger: 0.06 })
      .fromTo(labelRef.current, { yPercent: 120, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, "-=0.35")
      .add(() => navigate(to));
  }, [navigate]);

  useEffect(() => {
    if (!pending.current) return;
    lenis.scrollTo(0, { immediate: true, force: true });
    window.scrollTo(0, 0);
    const panels = overlay.current.querySelectorAll(".tp");
    gsap.timeline({ delay: 0.2, onComplete: () => { pending.current = null; gsap.set(overlay.current, { pointerEvents: "none" }); ScrollTrigger.refresh(); } })
      .to(labelRef.current, { yPercent: -120, opacity: 0, duration: 0.4, ease: "power3.in" })
      .set(panels, { transformOrigin: "top" })
      .to(panels, { scaleY: 0, duration: 0.75, ease: "hop", stagger: 0.06 }, "-=0.1")
      .add(() => setReady(true), "-=0.5");
  }, [location.pathname]);

  const value = useMemo(() => ({ go, ready, loaded, setLoaded, setReady }), [go, ready, loaded]);
  return (
    <Ctx.Provider value={value}>
      {children}
      <div ref={overlay} className="fixed inset-0 z-[9000] pointer-events-none">
        <div className="absolute inset-0 grid grid-cols-4">
          {[0, 1, 2, 3].map((i) => <div key={i} className="tp bg-ink border-r border-white/5 last:border-0" />)}
        </div>

          <div ref={labelRef} className="font-display text-bone text-5xl md:text-7xl italic opacity-0" style={{ fontVariationSettings: '"opsz" 144, "SOFT" 60' }}>{label}</div>
        </div>
      </div>

  );
}

/* Run GSAP inside a context, only once the page is uncovered */
function useFx(ref, fn, deps = []) {
  const { ready } = useApp();
  useEffect(() => {
    if (!ready || !ref.current) return;
    let ctx, cleanup, dead = false;
    document.fonts.ready.then(() => {
      if (dead || !ref.current) return;
      ctx = gsap.context(() => { cleanup = fn(); }, ref);
      ScrollTrigger.refresh();
    });
    return () => { dead = true; cleanup && cleanup(); ctx && ctx.revert(); };
  }, [ready, ...deps]);
}

/* Generic page effects: split lines, reveals, image masks, parallax */
function usePageFx(ref) {
  useFx(ref, () => {
    const root = ref.current;
    root.querySelectorAll("[data-split]").forEach((el) => {
      const split = new SplitText(el, { type: "lines", mask: "lines", linesClass: "split-line" });
      gsap.set(el, { visibility: "visible" });
      gsap.from(split.lines, { yPercent: 115, duration: 1.2, ease: "hop", stagger: 0.09, delay: +(el.dataset.delay || 0), scrollTrigger: { trigger: el, start: "top 90%", once: true } });
    });
    root.querySelectorAll(".reveal").forEach((el) => {
      gsap.fromTo(el, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "soft", delay: +(el.dataset.delay || 0), scrollTrigger: { trigger: el, start: "top 92%", once: true } });
    });
    root.querySelectorAll(".img-reveal").forEach((el) => {
      const media = el.querySelector("img, video");
      const tl = gsap.timeline({ scrollTrigger: { trigger: el, start: "top 88%", once: true } });
      tl.fromTo(el, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 1.3, ease: "hop" });
      if (media) tl.fromTo(media, { scale: 1.35 }, { scale: 1, duration: 1.8, ease: "power3.out" }, 0);
    });
    root.querySelectorAll("[data-parallax]").forEach((el) => {
      gsap.fromTo(el, { yPercent: -(+el.dataset.parallax || 12) }, { yPercent: +el.dataset.parallax || 12, ease: "none", scrollTrigger: { trigger: el.parentElement, start: "top bottom", end: "bottom top", scrub: true } });
    });
  });
}

function Magnetic({ children, strength = 0.35, className = "" }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current, r = el.getBoundingClientRect();
    gsap.to(el, { x: (e.clientX - r.left - r.width / 2) * strength, y: (e.clientY - r.top - r.height / 2) * strength, duration: 0.6, ease: "power3.out" });
  };
  const onLeave = () => gsap.to(ref.current, { x: 0, y: 0, duration: 1, ease: "elastic.out(1, 0.35)" });
  return <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={"inline-block " + className}>{children}</div>;
}

function Btn({ to, href, onClick, children, variant = "dark", icon = true, className = "" }) {
  const { go } = useApp();
  const cls = `btn ${variant === "dark" ? "btn-dark" : variant === "light" ? "btn-light" : variant === "ghost-dark" ? "btn-ghost on-dark" : "btn-ghost on-light"} ${className}`;
  const inner = <>{children}{icon && <ArrowUpRight size={16} className="ico" />}</>;
  if (href) return <Magnetic><a href={href} target={href.startsWith("http") ? "_blank" : undefined} rel="noreferrer" className={cls}>{inner}</a></Magnetic>;
  return <Magnetic><button onClick={() => (to ? go(to) : onClick && onClick())} className={cls}>{inner}</button></Magnetic>;
}

function Marquee({ items, dark = false, speed = 28, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const tween = gsap.to(ref.current, { xPercent: -50, repeat: -1, duration: speed, ease: "none" });
    const st = ScrollTrigger.create({ onUpdate: (self) => { const v = gsap.utils.clamp(-3, 3, self.getVelocity() / 260); gsap.to(tween, { timeScale: (self.direction || 1) * (1 + Math.abs(v)), duration: 0.5, overwrite: true }); } });
    return () => { tween.kill(); st.kill(); };
  }, []);
  const row = [...items, ...items];
  return (
    <div className={`overflow-hidden whitespace-nowrap ${className}`}>
      <div ref={ref} className="marquee-track">
        {row.map((t, i) => (
          <span key={i} className={`flex items-center gap-8 pr-8 font-display text-4xl md:text-6xl ${dark ? "text-bone" : "text-ink"}`}>
            <span className={i % 2 ? "italic font-light" : ""}>{t}</span>
            <span className="w-2.5 h-2.5 rounded-full bg-clay inline-block" />
          </span>
        ))}
      </div>
    </div>
  );
}

function Counter({ to, suffix = "", className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const st = ScrollTrigger.create({ trigger: el, start: "top 90%", once: true, onEnter: () => {
      const obj = { v: 0 };
      A.animate(obj, { v: to, duration: 2200, ease: "outExpo", modifier: A.utils.round(0), onUpdate: () => { el.textContent = Math.round(obj.v) + suffix; } });
    } });
    return () => st.kill();
  }, []);
  return <span ref={ref} className={className}>0{suffix}</span>;
}

function Video({ src, poster, className = "" }) {

  useEffect(() => { const v = ref.current; if (!v) return; v.muted = true; v.defaultMuted = true; const p = v.play(); p && p.catch && p.catch(() => {}); }, [src]);

function Cursor() {
  const dot = useRef(null), ring = useRef(null);
  const [txt, setTxt] = useState("");
  useEffect(() => {
    const xTo = gsap.quickTo(ring.current, "x", { duration: 0.4, ease: "power3" });
    const yTo = gsap.quickTo(ring.current, "y", { duration: 0.4, ease: "power3" });
    const move = (e) => { xTo(e.clientX); yTo(e.clientY); gsap.set(dot.current, { x: e.clientX, y: e.clientY }); };
    const over = (e) => {
      const c = e.target.closest("[data-cursor]");
      const l = e.target.closest("a, button, .swiper, .m-item, .swatch");
      setTxt(c ? c.dataset.cursor : "");
      document.body.classList.toggle("cursor-hover", !!c);
      document.body.classList.toggle("cursor-link", !c && !!l);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseover", over);
    return () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseover", over); };
  }, []);
  return <><div ref={dot} className="cursor-dot" /><div ref={ring} className="cursor-ring">{txt}</div></>;
}

function Hero() {
  const ref = useRef(null), h1 = useRef(null), sub = useRef(null), rot = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ["start start", "end start"] });
  const y = useTransform(scrollYProgress, [0, 1], [0, 180]);
  const scale = useTransform(scrollYProgress, [0, 1], [1, 1.18]);
  const fade = useTransform(scrollYProgress, [0, 0.7], [1, 0]);

  useFx(ref, () => {
    let splits = [];
    const run = async () => {
      // Pretext: measure the headline and pick the largest size that holds in two lines
      try {
        const mod = await Promise.race([import("https://esm.sh/@chenglou/pretext"), new Promise((_, rej) => setTimeout(rej, 700))]);
        const text = h1.current.textContent.replace(/\s+/g, " ").trim();
        const width = h1.current.clientWidth;
        let size = Math.min(140, Math.round(width / 6.3)), fitted = null;
        for (; size > 42; size -= 4) {
          const prepared = mod.prepare(text, `400 ${size}px Fraunces`);
          const r = mod.layout(prepared, width, size * 0.95);
          const lines = r && (r.lineCount ?? Math.round(r.height / (size * 0.95)));
          if (!Number.isFinite(lines)) throw new Error("pretext: unexpected layout result");
          if (lines <= 2) { fitted = size; break; }
        }
        if (fitted && h1.current) h1.current.style.fontSize = fitted + "px";
      } catch (e) { /* graceful fallback to clamp() */ }
      if (!h1.current) return;
      const s = new SplitText(h1.current, { type: "lines,words", mask: "lines" });
      splits.push(s);
      gsap.set(h1.current, { visibility: "visible" });
      gsap.timeline({ delay: 0.1 })
        .from(s.words, { yPercent: 120, rotate: 3, duration: 1.4, ease: "hop", stagger: 0.04 })
        .fromTo(ref.current.querySelectorAll(".h-fade"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "soft", stagger: 0.1 }, "-=0.8")
        .fromTo(ref.current.querySelector(".h-line"), { scaleX: 0, opacity: 1, transformOrigin: "left" }, { scaleX: 1, opacity: 1, duration: 1.2, ease: "hop" }, "-=0.9");
      const words = ["bedrooms", "kitchens", "living halls", "bathrooms", "offices", "villas"];
      const tl = gsap.timeline({ repeat: -1, delay: 1.5 });
      words.forEach((w) => tl.to(sub.current, { text: w, duration: 0.5, ease: "none" }).to({}, { duration: 1.4 }));
    };
    run();
    return () => splits.forEach((s) => s.revert());
  });

  return (
    <section ref={ref} className="relative h-[100svh] min-h-[640px] overflow-hidden bg-ink text-bone">
      <motion.div style={{ scale, y }} className="absolute inset-0">
        <Video className="w-full h-full object-cover" src={VIDEO_HERO} poster={px(8135496, 1920, 1080)} />
      </motion.div>
      <div className="absolute inset-0 bg-gradient-to-t from-ink via-ink/35 to-ink/40" />
      <div className="absolute inset-0 bg-gradient-to-r from-ink/60 via-transparent to-transparent" />

      <motion.div style={{ opacity: fade }} className="relative h-full flex flex-col justify-end px-6 md:px-10 pb-10 md:pb-14">
        <div className="h-fade label text-stone mb-6 flex items-center gap-4"><span className="w-10 h-px bg-brass" /> Khammam · Interior Design & Architecture · Est. 2014</div>
        <h1 ref={h1} className="font-display leading-[0.95] tracking-[-0.03em] max-w-[16ch]" style={{ fontSize: "clamp(2.6rem, 8.2vw, 9rem)", visibility: "hidden" }}>
          Spaces that breathe, <em className="italic text-brass">homes</em> that speak.
        </h1>
        <div className="h-line mt-8 md:mt-10 h-px w-full bg-bone/20" />
        <div className="grid md:grid-cols-12 gap-6 pt-6 items-end">
          <p className="h-fade md:col-span-5 text-stone text-base md:text-lg leading-relaxed max-w-md">A Khammam studio designing <span ref={sub} className="text-bone italic font-display text-xl">bedrooms</span> — and everything around them — with space optimisation, statement lighting and storage you never notice.</p>
          <div className="h-fade md:col-span-4 flex flex-wrap gap-3">
            <Btn variant="light" to="/projects">View projects</Btn>
            <Btn variant="ghost-dark" to="/contact">Book a visit</Btn>
          </div>
          <div className="h-fade md:col-span-3 flex md:justify-end">
            <div ref={rot} className="relative w-28 h-28 spin-slow">
              <svg viewBox="0 0 100 100" className="w-full h-full">
                <defs><path id="circ" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0" /></defs>
                <text className="fill-bone/70" style={{ fontSize: 8.6, letterSpacing: "0.28em", fontFamily: "Manrope" }}><textPath href="#circ">SCROLL TO EXPLORE • EZY INTERIORS • </textPath></text>
              </svg>
              <div className="absolute inset-0 flex items-center justify-center"><ArrowRight size={16} className="rotate-90 text-brass" /></div>
            </div>
          </div>
        </div>
      </motion.div>
    </section>
  );

      showDuration: 500, hideDuration: 400, dragEnabled: true, dragStartPredicate: { distance: 14, delay: 0 }, dragRelease: { duration: 500, easing: "cubic-bezier(0.625, 0.05, 0, 1)" },
      dragSortHeuristics: { sortInterval: 60 },

    grid.current.querySelectorAll("img").forEach((img) => { if (!img.complete) img.addEventListener("load", () => g.refreshItems().layout(), { once: true }); });

        <div ref={grid} className="m-grid -mx-3">

              </div>
            </div>

  );

              <h2 data-split className="font-display text-5xl md:text-6xl tracking-[-0.02em] mb-6">{s.title}</h2>
              <p className="reveal text-mist leading-relaxed max-w-lg mb-8">{s.desc}</p>
              <ul className="grid sm:grid-cols-2 gap-x-8">
                {s.pts.map((pt, i) => <li key={pt} className="reveal flex items-center gap-3 py-3 border-b hairline text-sm" data-delay={i * 0.05}><span className="w-1.5 h-1.5 rounded-full bg-clay" />{pt}</li>)}
              </ul>
            </div>
          ))}
        </div>
      </section>

      <section className="bg-ink text-bone px-6 md:px-10 py-24 md:py-32">
        <SectionHead dark eyebrow="Project scope" title={<>Residential &<br /><span className="italic">commercial</span>.</>} right={
          <div className="flex gap-1 bg-bone/5 rounded-full p-1">{["All", "Residential", "Commercial"].map((s) => <button key={s} onClick={() => setScopeFlip(s)} className={`px-5 py-2 rounded-full text-[12px] tracking-[0.18em] uppercase transition-colors ${scope === s ? "bg-bone text-ink" : "text-stone hover:text-bone"}`}>{s}</button>)}</div>
        } />
        <div ref={cards} className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          {RES.map((r) => (
            <div key={r.t} data-scope={r.s} className="svc-card group relative aspect-[3/4] overflow-hidden rounded-sm bg-ink-2">
              <img src={px(r.img, 700, 950)} alt="" className="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-90 group-hover:scale-105 transition-all duration-1000" loading="lazy" />
              <div className="absolute inset-0 bg-gradient-to-t from-ink to-transparent" />
              <div className="absolute top-5 left-5 text-[10px] tracking-[0.2em] uppercase text-brass">{r.s}</div>
              <div className="absolute bottom-5 left-5 right-5"><h3 className="font-display text-2xl">{r.t}</h3><p className="text-xs text-stone mt-1">{r.d}</p></div>
            </div>
          ))}
        </div>
      </section>

      <section className="px-6 md:px-10 py-24 md:py-32 grid lg:grid-cols-12 gap-12">
        <div className="lg:col-span-4">
          <div className="eyebrow reveal mb-6">Questions</div>
          <h2 data-split className="font-display text-5xl md:text-6xl tracking-[-0.02em] leading-[0.98]">Asked before<br />every <span className="italic">first visit</span>.</h2>
          <div className="reveal mt-8"><Btn to="/contact">Ask something else</Btn></div>
        </div>
        <div className="lg:col-span-8 border-t hairline">
          {FAQS.map((f, i) => (
            <motion.div key={f.q} layout className="border-b hairline">
              <button onClick={() => setOpenQ(openQ === i ? -1 : i)} className="w-full flex items-center justify-between gap-6 py-7 text-left">
                <span className="font-display text-2xl md:text-3xl">{f.q}</span>
                <motion.span animate={{ rotate: openQ === i ? 45 : 0 }} transition={{ duration: 0.4 }} className="w-10 h-10 rounded-full border hairline flex items-center justify-center shrink-0"><Plus size={16} /></motion.span>
              </button>
              <AnimatePresence initial={false}>
                {openQ === i && <motion.div key="a" initial={{ height: 0, opacity: 0 }} animate={{ height: "auto", opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ duration: 0.5, ease: [0.22, 1, 0.36, 1] }} className="overflow-hidden"><p className="pb-8 text-mist leading-relaxed max-w-2xl">{f.a}</p></motion.div>}
              </AnimatePresence>
            </motion.div>
          ))}
        </div>
      </section>
      <Process dark />
    </main>
  );
}

/* ═══════════════════════════════════════════════════════════════
   10. STUDIO (story, DrawSVG timeline, draggable moodboard)
═══════════════════════════════════════════════════════════════ */
function StudioPage() {
  const ref = useRef(null), tl = useRef(null), board = useRef(null);
  usePageFx(ref);
  useFx(ref, () => {
    gsap.fromTo(tl.current.querySelector(".line"), { drawSVG: "0%" }, { drawSVG: "100%", ease: "none", scrollTrigger: { trigger: tl.current, start: "top 70%", end: "bottom 70%", scrub: true } });
    tl.current.querySelectorAll(".node").forEach((n) => gsap.fromTo(n, { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2)", scrollTrigger: { trigger: n, start: "top 70%", once: true } }));
    let z = 10;
    const swatches = board.current.querySelectorAll(".swatch");
    Draggable.create(swatches, { bounds: board.current, inertia: true, edgeResistance: 0.85, onPress() { gsap.to(this.target, { scale: 1.06, zIndex: ++z, duration: 0.3 }); }, onRelease() { gsap.to(this.target, { scale: 1, duration: 0.5, ease: "back.out(2)" }); } });
    swatches.forEach((s, i) => gsap.set(s, { rotate: gsap.utils.random(-8, 8), x: gsap.utils.random(0, 40), y: gsap.utils.random(0, 30) }));
    // Anime.js: soft breathing on the value chips
    A.animate(ref.current.querySelectorAll(".chip"), { y: [{ to: -4 }, { to: 0 }], duration: 2400, delay: A.stagger(200), loop: true, ease: "inOutSine" });
  });
  const VALUES = [["Honest quotes", "Itemised and in plain language."], ["Same-day replies", "Every enquiry answered today."], ["Own execution team", "Design and build under one roof."], ["Local knowledge", "Khammam climate, vendors and craft."]];
  const SWATCHES = [["Walnut", "#5b3a29"], ["Bone", "#f4efe7"], ["Brass", "#c9a45c"], ["Clay", "#b4613a"], ["Moss", "#5b6b55"], ["Charcoal", "#141311"], ["Marble", "#e6e2db"]];
  return (
    <main ref={ref}>
      <PageHero eyebrow="Studio · Khammam since 2014" title={<>A small studio with<br /><span className="italic text-brass">big</span> standards.</>} text="Two studios, one team, and a decade of homes and offices across Khammam and beyond." img={7546323} video={VIDEO_STUDIO} />

      <section className="px-6 md:px-10 py-24 md:py-32 grid lg:grid-cols-12 gap-12 items-start">
        <div className="lg:col-span-5 lg:sticky lg:top-24">
          <div className="eyebrow reveal mb-6">Our story</div>
          <h2 data-split className="font-display text-5xl md:text-6xl leading-[0.98] tracking-[-0.02em]">Started above a college road. Still here, still answering the phone.</h2>
        </div>
        <div className="lg:col-span-7 space-y-8 text-lg leading-relaxed text-mist">
          <p className="reveal">Ezy Interiors & Architects began in 2014 on the third floor of SV Complex, Yellandu Road — opposite the SR & BGNR college — with a single drafting table and a simple promise: reply fast, quote honestly, and build what we draw.</p>
          <p className="reveal">A decade on, we design and execute residential and commercial spaces across Khammam from two studios. Our style moves from contemporary to classic, but the discipline never changes: optimise the space, make movement seamless, let lighting make a statement, choose textures by touch, and integrate storage until it disappears.</p>
          <div className="img-reveal aspect-[16/10] overflow-hidden"><img src={px(8089172, 1400, 900)} alt="Studio work" className="w-full h-full object-cover" /></div>
          <div className="grid grid-cols-2 gap-4 pt-4">
            {VALUES.map(([t, d], i) => <div key={t} className="chip reveal border hairline rounded-sm p-5" data-delay={i * 0.06}><div className="font-display text-xl text-ink mb-1">{t}</div><div className="text-sm">{d}</div></div>)}
          </div>
        </div>
      </section>

      <section ref={tl} className="bg-ink text-bone px-6 md:px-10 py-24 md:py-32">
        <SectionHead dark eyebrow="Timeline" title={<>Twelve years,<br /><span className="italic">six</span> chapters.</>} />
        <div className="relative grid lg:grid-cols-[80px_1fr]">
          <svg className="absolute left-[19px] lg:left-[39px] top-0 h-full w-[2px]" viewBox="0 0 2 100" preserveAspectRatio="none"><path className="line" d="M1 0 V100" stroke="#c9a45c" strokeWidth="2" fill="none" /></svg>
          <div className="hidden lg:block" />
          <ol className="space-y-16 md:space-y-24">
            {TIMELINE.map((t) => (
              <li key={t.y} className="relative pl-14 lg:pl-0 grid lg:grid-cols-12 gap-4 items-start">
                <span className="node absolute left-[14px] lg:-left-[46px] top-3 w-3 h-3 rounded-full bg-brass" />
                <div className="lg:col-span-3 font-display text-6xl md:text-7xl text-stroke leading-none">{t.y}</div>
                <div className="lg:col-span-9"><h3 className="font-display text-3xl mb-2">{t.t}</h3><p className="text-stone max-w-xl">{t.d}</p></div>
              </li>
            ))}
          </ol>
        </div>
      </section>

      <section className="px-6 md:px-10 py-24 md:py-32 bg-sand">
        <SectionHead eyebrow="Material moodboard" title={<>Pick it up.<br />Move it <span className="italic">around</span>.</>} right={<p className="text-mist">Our palettes start on a table like this one. Drag the swatches — they have weight, and they settle.</p>} />
        <div ref={board} className="relative h-[460px] md:h-[520px] rounded-sm border hairline bg-bone/40 overflow-hidden" data-cursor="Drag">
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(20,19,17,.12)_1px,transparent_0)] [background-size:24px_24px]" />
          {SWATCHES.map(([n, c], i) => (
            <div key={n} className="swatch absolute w-36 h-44 md:w-44 md:h-56 rounded-sm shadow-xl border border-black/10 p-3 flex flex-col justify-end" style={{ background: c, left: `${8 + (i * 12) % 70}%`, top: `${10 + (i * 17) % 45}%` }}>
              <span className={`text-[10px] tracking-[0.2em] uppercase ${["#f4efe7", "#e6e2db", "#c9a45c"].includes(c) ? "text-ink" : "text-bone"}`}>{n}</span>
              <span className={`font-mono text-[10px] ${["#f4efe7", "#e6e2db", "#c9a45c"].includes(c) ? "text-ink/60" : "text-bone/60"}`}>{c}</span>
            </div>
          ))}
          <div className="absolute bottom-4 left-4 flex gap-4 items-center"><img src={px(7587804, 300, 200)} alt="" className="w-24 h-16 object-cover rounded-sm opacity-80" /><img src={px(8082195, 300, 200)} alt="" className="w-24 h-16 object-cover rounded-sm opacity-80" /></div>
        </div>
      </section>

      <section className="px-6 md:px-10 py-24 md:py-32">
        <div className="grid lg:grid-cols-12 gap-10 items-center">
          <div className="lg:col-span-5">
            <div className="eyebrow reveal mb-6">Presence</div>
            <h2 data-split className="font-display text-5xl md:text-6xl tracking-[-0.02em] leading-[0.98]">Verified, listed<br />and <span className="italic">reachable</span>.</h2>
            <p className="reveal text-mist mt-6 max-w-md">Find our portfolio of 80+ photos on Justdial, and our verified listings on Joonsquare and WallsToWonder. Or simply call — we pick up.</p>
            <div className="reveal mt-8 flex gap-3 flex-wrap"><Btn to="/contact">Visit the studio</Btn><Btn variant="ghost-light" href={BIZ.site}>ezyinterior.com</Btn></div>
          </div>
          <div className="lg:col-span-7 grid grid-cols-3 gap-3">
            {["Justdial", "Joonsquare", "WallsToWonder"].map((n, i) => <div key={n} className="reveal aspect-square border hairline rounded-sm flex flex-col items-center justify-center gap-3 hover:bg-ink hover:text-bone transition-colors duration-500" data-delay={i * 0.08}><Check size={18} className="text-brass" /><span className="font-display text-lg md:text-2xl text-center px-2">{n}</span><span className="label">Verified</span></div>)}
          </div>
        </div>
      </section>
      <Testimonials />
    </main>
  );
}

/* ═══════════════════════════════════════════════════════════════
   11. CONTACT (Sonner-powered form, maps, hours)
═══════════════════════════════════════════════════════════════ */
function ContactPage() {
  const ref = useRef(null);
  const [office, setOffice] = useState(0);
  const [form, setForm] = useState({ name: "", phone: "", email: "", type: "Residential interiors", budget: "₹5 – 10 L", msg: "" });
  const [busy, setBusy] = useState(false);
  usePageFx(ref);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    if (!form.name || !form.phone) { toast.error("A name and phone number help us call you back.", { description: "Both fields are required." }); return; }
    if (!/^[+\d\s-]{10,15}$/.test(form.phone)) { toast.warning("That phone number looks unusual.", { description: "Please check the digits and try again." }); return; }
    setBusy(true);
    const p = new Promise((res) => setTimeout(res, 1900));
    toast.promise(p, { loading: "Sending your brief to the studio…", success: () => { setBusy(false); setForm({ ...form, msg: "" }); return `Thank you, ${form.name.split(" ")[0]} — we'll call ${form.phone} within 24 hours.`; }, error: "Something went wrong. Please call us directly." });
    setTimeout(() => toast("Prefer WhatsApp?", { description: "Tap to continue the conversation there.", action: { label: "Open", onClick: () => window.open(`https://wa.me/${BIZ.phoneRaw}`) } }), 3200);
  };
  const inp = "w-full bg-transparent border-b hairline py-4 outline-none focus:border-ink transition-colors placeholder:text-mist/70";
  return (
    <main ref={ref}>
      <section className="pt-36 md:pt-48 px-6 md:px-10 pb-16 grid lg:grid-cols-12 gap-10">
        <div className="lg:col-span-7">
          <div className="eyebrow reveal mb-6">Contact</div>
          <h1 data-split className="font-display text-6xl md:text-8xl xl:text-9xl leading-[0.92] tracking-[-0.03em]">Let's talk<br />about <span className="italic text-clay">your</span> space.</h1>
        </div>
        <div className="lg:col-span-5 lg:pt-16 space-y-6 text-lg">
          <a href={`tel:${BIZ.phone}`} className="reveal flex items-center gap-4 group"><span className="w-12 h-12 rounded-full border hairline flex items-center justify-center group-hover:bg-ink group-hover:text-bone transition-colors"><Phone size={16} /></span><span className="u-link">{BIZ.phone}</span></a>
          <a href={`mailto:${BIZ.email}`} className="reveal flex items-center gap-4 group" data-delay="0.08"><span className="w-12 h-12 rounded-full border hairline flex items-center justify-center group-hover:bg-ink group-hover:text-bone transition-colors"><Mail size={16} /></span><span className="u-link">{BIZ.email}</span></a>
          <div className="reveal flex items-center gap-4" data-delay="0.16"><span className="w-12 h-12 rounded-full border hairline flex items-center justify-center"><Clock size={16} /></span><span>{BIZ.hours}</span></div>
        </div>
      </section>

      <section className="px-6 md:px-10 pb-24 md:pb-32 grid lg:grid-cols-12 gap-12">
        <form onSubmit={submit} className="lg:col-span-7 reveal">
          <div className="grid md:grid-cols-2 gap-x-8">
            <label className="block"><span className="label">Name *</span><input className={inp} value={form.name} onChange={set("name")} placeholder="Your full name" /></label>
            <label className="block"><span className="label">Phone *</span><input className={inp} value={form.phone} onChange={set("phone")} placeholder="+91" /></label>
            <label className="block md:col-span-2 mt-6"><span className="label">Email</span><input className={inp} type="email" value={form.email} onChange={set("email")} placeholder="you@example.com" /></label>
            <label className="block mt-6"><span className="label">Project type</span>
              <select className={inp} value={form.type} onChange={set("type")}>{["Residential interiors", "Modular kitchen", "Commercial / office", "Architecture (new build)", "Consultation only"].map((o) => <option key={o}>{o}</option>)}</select></label>
            <label className="block mt-6"><span className="label">Indicative budget</span>
              <select className={inp} value={form.budget} onChange={set("budget")}>{["Under ₹5 L", "₹5 – 10 L", "₹10 – 25 L", "₹25 L+", "Not sure yet"].map((o) => <option key={o}>{o}</option>)}</select></label>
            <label className="block md:col-span-2 mt-6"><span className="label">Tell us about the space</span><textarea rows="4" className={inp + " resize-none"} value={form.msg} onChange={set("msg")} placeholder="Rooms, size, style you like, timeline…" /></label>
          </div>
          <div className="mt-10 flex flex-wrap items-center gap-6">
            <Magnetic><button type="submit" disabled={busy} className="btn btn-dark disabled:opacity-60">{busy ? "Sending…" : "Send brief"} <Send size={15} className="ico" /></button></Magnetic>
            <span className="text-sm text-mist">We reply the same day, 7 days a week.</span>
          </div>
        </form>

        <div className="lg:col-span-5 space-y-6">
          <div className="reveal flex gap-1 bg-sand rounded-full p-1 w-max">{BIZ.offices.map((o, i) => <button key={o.name} onClick={() => setOffice(i)} className={`px-5 py-2 rounded-full text-[12px] tracking-[0.18em] uppercase transition-colors ${office === i ? "bg-ink text-bone" : "text-mist hover:text-ink"}`}>Studio {i + 1}</button>)}</div>
          <AnimatePresence mode="wait">
            <motion.div key={office} initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -16 }} transition={{ duration: 0.5 }} className="border hairline rounded-sm overflow-hidden">
              <iframe title={BIZ.offices[office].name} src={BIZ.offices[office].map} className="w-full h-[300px] grayscale contrast-[1.05]" loading="lazy" referrerPolicy="no-referrer-when-downgrade" />
              <div className="p-6">
                <div className="flex items-start gap-3"><MapPin size={16} className="text-clay mt-1 shrink-0" /><div><div className="font-display text-xl mb-1">{BIZ.offices[office].name}</div>{BIZ.offices[office].lines.map((l) => <div key={l} className="text-sm text-mist">{l}</div>)}</div></div>
                <div className="mt-5 pt-5 border-t hairline flex items-center justify-between text-sm"><ISTClock /><span className="text-mist">GSTIN {BIZ.gstin}</span></div>
              </div>
            </motion.div>
          </AnimatePresence>
          <div className="reveal grid grid-cols-2 gap-3">
            <a href={`https://wa.me/${BIZ.phoneRaw}`} target="_blank" rel="noreferrer" className="border hairline rounded-sm p-5 hover:bg-ink hover:text-bone transition-colors group"><MessageCircle size={18} className="text-brass mb-4" /><div className="font-display text-xl">WhatsApp</div><div className="text-xs text-mist group-hover:text-stone">Photos, plans & quick replies</div></a>
            <button onClick={() => { navigator.clipboard?.writeText(BIZ.phone); toast.success("Number copied", { description: BIZ.phone }); }} className="text-left border hairline rounded-sm p-5 hover:bg-ink hover:text-bone transition-colors group"><Copy size={18} className="text-brass mb-4" /><div className="font-display text-xl">Copy number</div><div className="text-xs text-mist group-hover:text-stone">{BIZ.phone}</div></button>
          </div>
        </div>
      </section>
      <Marquee items={["Same-day replies", "Itemised quotations", "Site visits in 48h", "Open 7 days"]} className="py-8 border-t hairline" />
    </main>
  );
}

/* ═══════════════════════════════════════════════════════════════
   12. APP SHELL
═══════════════════════════════════════════════════════════════ */
function Shell() {
  const { loaded, setLoaded, setReady } = useApp();
  const location = useLocation();
  useEffect(() => { ScrollTrigger.refresh(); }, [location.pathname]);
  const onDone = () => { setLoaded(true); setReady(true); setTimeout(() => toast("Welcome to Ezy Interiors & Architects", { description: "Khammam · Open 7 days · 9 AM – 8 PM", icon: <Sparkles size={16} /> }), 1400); };
  return (
    <>
      {!loaded && <Preloader onDone={onDone} />}
      <Cursor />
      <Nav />
      <Routes location={location}>
        <Route path="/" element={<HomePage />} />
        <Route path="/projects" element={<ProjectsPage />} />
        <Route path="/projects/:slug" element={<ProjectPage />} />
        <Route path="/services" element={<ServicesPage />} />
        <Route path="/studio" element={<StudioPage />} />
        <Route path="/contact" element={<ContactPage />} />
        <Route path="*" element={<HomePage />} />
      </Routes>
      <Footer />
      <BackTop />
      <Toaster position="bottom-right" theme="dark" richColors closeButton toastOptions={{ style: { background: "#1e1c19", border: "1px solid rgba(244,239,231,.12)", color: "#f4efe7" } }} />
    </>
  );
}

function App() {
  return (
    <HashRouter>
      <AppProvider>
        <Shell />
      </AppProvider>
    </HashRouter>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
