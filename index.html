  <style>
    :root { color-scheme: dark; --ink: #0b0e10; --paper: #f0efe9; --muted: #9a9f9e; --accent: #d5f575; --line: rgba(238,243,229,.13); }

    .grain { z-index: 8; opacity: .045; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23noise)' opacity='.7' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .stage { z-index: 2; perspective: 1300px; }

          chunk += `${chunk ? ' ' : ''}${word}`;
        }
        if (chunk) chunks.push(chunk);
      }
      return chunks;
    }

    function attachTensorCleanup(tts) {
      const model = tts.model;
      const forward = async inputs => {
        let outputs;
        try {
          outputs = await model(inputs);
          return {waveform: {data: new Float32Array(outputs.waveform.data)}};
        } finally {
          for (const tensor of new Set([...Object.values(inputs), ...Object.values(outputs || {})])) {
            try { tensor?.dispose?.(); } catch {}
          }
        }
      };
      forward.dispose = () => model.dispose();
      tts.model = forward;
    }

    self.onmessage = async event => {
      const request = event.data;
      if (request.type === 'cancel') { canceled = request.requestId; return; }
      if (request.type !== 'generate' || busy) return;
      busy = true;
      const {requestId, profile} = request;
      const report = (message, stage = 'generate') => self.postMessage({type: 'status', requestId, message, stage, backend: profile.backend, precision: profile.precision});
      try {
        if (!/^a[mf]_/.test(VOICE)) throw new Error('Narration requires an American English voice.');
        if (profile.backend === 'webgpu' && profile.precision !== 'fp32') throw new Error('GPU narration requires full precision. Retry with the CPU voice.');
        if (typeof request.text !== 'string' || !request.text.trim()) throw new Error('Narration text is missing.');
        if (!synthesizer) {
          report('Loading the voice engine…', 'load');
          const {KokoroTTS} = await import(KOKORO_MODULE);
          synthesizer = await KokoroTTS.from_pretrained(MODEL_ID, {device: profile.backend, dtype: profile.precision, progress_callback: progress => {
            if (progress.status !== 'progress' || Date.now() - lastProgress < 350) return;
            lastProgress = Date.now();
            report(`Downloading ${progress.file || 'voice model'}${Number.isFinite(progress.progress) ? ` · ${Math.round(progress.progress)}%` : ''}`, 'load');
          }});
          attachTensorCleanup(synthesizer);
        }
        const chunks = splitNarration(request.text, profile.chunkChars);
        for (const [index, text] of chunks.entries()) {
          if (canceled === requestId) break;
          report(`Preparing ${request.title} · phrase ${index + 1}/${chunks.length}`);
          const inferenceStart = performance.now();
          const audio = await synthesizer.generate(text, {voice: VOICE, speed: 1});
          const inferenceSeconds = (performance.now() - inferenceStart) / 1000;
          const samples = audio.audio;
          if (audio.sampling_rate !== 24000 || samples.length < 2400 || samples.length > 24000 * 20 || !samples.every(Number.isFinite)) throw new Error('Invalid voice output.');
          if (canceled !== requestId) self.postMessage({type: 'chunk', requestId, samples, sampleRate: 24000, inferenceSeconds}, [samples.buffer]);
          await new Promise(resolve => setTimeout(resolve, 0));
        }
        self.postMessage({type: canceled === requestId ? 'canceled' : 'complete', requestId});
      } catch (error) {
        self.postMessage({type: 'error', requestId, message: error instanceof Error ? error.message : String(error)});
      } finally { busy = false; }
    };

        return previous;
      });

    function makeAtmosphere(canvas, reducedMotion, lowPower = false) {
      const context = canvas.getContext('2d');
      if (!context) return { draw() {}, destroy() {} };
      let width = 0, height = 0, lastTime = -1;
      const stars = Array.from({length: lowPower ? 30 : 72}, (_,index) => ({ x: ((index * 137.508) % 997) / 997, y: ((index * 97.71) % 991) / 991, radius: .4 + (index % 3) * .3, phase: index * .8 }));
      function resize() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width; height = bounds.height;
        const ratio = Math.min(window.devicePixelRatio || 1, lowPower ? 1 : 1.5);
        canvas.width = width * ratio; canvas.height = height * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        lastTime = -1;
      }
      function draw(time, force = false) {
        if (!force && Math.abs(time - lastTime) < 1 / (lowPower ? 20 : 30)) return;
        lastTime = time;
        const movementTime = reducedMotion ? 0 : time;
        context.clearRect(0, 0, width, height);
        context.strokeStyle = 'rgba(154,180,139,.09)'; context.lineWidth = .65;
        const horizon = height * .69;
        const drift = Math.sin(movementTime * .045) * width * .1;
        for (let index = -12; index <= 12; index++) {
          context.beginPath(); context.moveTo(width * .72 + drift + index * 12, horizon); context.lineTo(width * .72 + drift + index * width / 9, height); context.stroke();
        }
        for (let index = 0; index < 12; index++) {
          const progress = (index / 12 + movementTime * .018) % 1;
          const vertical = horizon + progress * progress * (height - horizon);
          context.beginPath(); context.moveTo(0, vertical); context.lineTo(width, vertical); context.stroke();
        }
        stars.forEach(star => {
          const horizontal = (star.x * width + Math.sin(movementTime * .035 + star.phase) * 15 + width) % width;
          const vertical = (star.y * height + Math.cos(movementTime * .025 + star.phase) * 10 + height) % height;
          context.fillStyle = `rgba(211,225,191,${.15 + (Math.sin(movementTime * .35 + star.phase) + 1) * .14})`;
          context.beginPath(); context.arc(horizontal, vertical, star.radius, 0, Math.PI * 2); context.fill();
        });
      }
      const observer = new ResizeObserver(() => { resize(); draw(lastDrawTime, true); });
      let lastDrawTime = 0;
      observer.observe(canvas); resize(); draw(0, true);
      return { draw(time) { lastDrawTime = time; draw(time); }, destroy() { observer.disconnect(); } };
    }

    function portraitLayout(scene, width, height) {
      const mobile = width <= 600;
      const featured = scene.id === 'intro' || scene.id === 'contact';
      const inset = Math.max(8, Math.min(width, height) * .025);
      const size = Math.min(
        featured ? Math.min(width * (mobile ? .66 : .37), height * (mobile ? .30 : .53), 580)
          : Math.min(width * (mobile ? .27 : .21), height * (mobile ? .16 : .25), 280),
        width - inset * 2, height - inset * 2
      );
      const centerX = width * (featured ? (mobile ? .51 : .745) : (mobile ? .15 : .66));
      const centerY = height * (mobile ? .655 : featured ? .44 : .14);
      return {
        x: clamp(centerX - size / 2, inset, width - size - inset),
        y: clamp(centerY - size / 2, inset, height - size - inset),
        size
      };
    }

    function createFilmRenderer(root, reducedMotion, lowPower, onFrame = () => {}) {
      const atmosphere = makeAtmosphere(root.querySelector('.ambient'), reducedMotion, lowPower);
      const orbit = anime({targets: root.querySelector('.orbit-rotation'), rotate: [0, 360], duration: 60000, easing: 'linear', autoplay: false});
      const waveform = anime({targets: root.querySelectorAll('.waveform i'), scaleY: [.35, 1], duration: 900, delay: anime.stagger(29), direction: 'alternate', easing: 'easeInOutSine', autoplay: false});
      const subject = root.querySelector('.subject');
      let viewport = {width: root.clientWidth, height: root.clientHeight};
      const viewportObserver = new ResizeObserver(() => {
        viewport = {width: root.clientWidth, height: root.clientHeight};
        draw();
      });
      const shots = SCENES.map(scene => root.querySelector(`[data-scene="${scene.id}"]`));
      const cues = SCENES.map(directionTimes);
      const beatNodes = shots.map(shot => [...shot.querySelectorAll('.story-beat')]);
      const focusNodes = shots.map((shot, index) => SCENE_DIRECTION[SCENES[index].id].map(([, , , selector]) => [...shot.querySelectorAll(selector)]));
      let lastFocus = '';
      let timeline;
      const draw = () => {
        if (!timeline) return;
        const now = timeline.time(), index = sceneAt(now), scene = SCENES[index];
        const local = now - scene.start;
        const previous = portraitLayout(SCENES[Math.max(0, index - 1)], viewport.width, viewport.height);
        const target = portraitLayout(scene, viewport.width, viewport.height);
        const progress = reducedMotion ? 1 : clamp(local / 1.8, 0, 1);
        const blend = progress ** 3 * (progress * (progress * 6 - 15) + 10);
        const size = previous.size + (target.size - previous.size) * blend;
        let horizontal = previous.x + (target.x - previous.x) * blend;
        let vertical = previous.y + (target.y - previous.y) * blend;
        if (viewport.width <= 600) {
          const bounds = root.getBoundingClientRect();
          const artwork = shots[index].querySelector('.scene-art').getBoundingClientRect();
          const featured = scene.id === 'intro' || scene.id === 'contact';
          horizontal = featured ? artwork.left - bounds.left + (artwork.width - size) / 2 : viewport.width * .07;
          vertical = artwork.top - bounds.top + (artwork.height - size) / 2;
          subject.style.visibility = vertical >= 100 && vertical + size <= viewport.height - 150 ? 'visible' : 'hidden';
        } else subject.style.visibility = 'visible';
        subject.style.width = `${size.toFixed(3)}px`;
        subject.style.height = `${size.toFixed(3)}px`;
        subject.style.fontSize = `${clamp(size * .04, 6, 10).toFixed(2)}px`;
        subject.style.transform = `translate3d(${horizontal.toFixed(3)}px, ${vertical.toFixed(3)}px, 0)`;
        orbit.seek(reducedMotion ? 0 : (now * 1000) % 60000);
        const waveTime = scene.id === 'music' ? Math.max(0, local - cues[index][2]) : 0;
        const waveCycle = (waveTime * 1000) % (waveform.duration * 2);
        waveform.seek(reducedMotion ? 900 : (waveCycle <= waveform.duration ? waveCycle : waveform.duration * 2 - waveCycle));
        atmosphere.draw(now);
        const activeBeat = Math.max(0, cues[index].findLastIndex(cue => local >= cue));
        beatNodes[index].forEach((node, beatIndex) => {
          node.classList.toggle('is-current', beatIndex === activeBeat);
          node.classList.toggle('is-complete', beatIndex < activeBeat);
          const start = cues[index][beatIndex], end = cues[index][beatIndex + 1] ?? scene.duration - .4;
          node.querySelector('.beat-progress').style.transform = `scaleX(${clamp((local - start) / Math.max(.1, end - start), 0, 1)})`;
        });
        const focus = `${index}:${activeBeat}`;
        if (lastFocus !== focus) {
          root.querySelectorAll('.narration-focus').forEach(node => node.classList.remove('narration-focus'));
          focusNodes[index][activeBeat].forEach(node => node.classList.add('narration-focus'));
          lastFocus = focus;
        }
        onFrame(now, index);
      };
      const context = gsap.context(() => {
        timeline = gsap.timeline({paused: true, onUpdate: draw});
        timeline.to({elapsed: 0}, {elapsed: DURATION, duration: DURATION, ease: 'none'}, 0);
        SCENES.forEach((scene, index) => {
          const shot = shots[index], reveals = shot.querySelectorAll('.reveal');
          const props = shot.querySelectorAll('.prop');
          timeline.addLabel(scene.id, scene.start);
          timeline.fromTo(shot, {autoAlpha: 0}, {autoAlpha: 1, duration: reducedMotion ? .15 : .65}, scene.start);
          timeline.fromTo(shot.querySelector('.chapter-line'), {opacity: 0, y: reducedMotion ? 0 : 8}, {opacity: 1, y: 0, duration: .6}, scene.start);
          timeline.fromTo(reveals, {y: reducedMotion ? 0 : 18, opacity: 0}, {y: 0, opacity: 1, duration: reducedMotion ? .15 : .9, stagger: reducedMotion ? 0 : .08, ease: 'power2.out'}, scene.start + .12);
          props.forEach((prop, propIndex) => {
            const beat = SCENE_DIRECTION[scene.id].findIndex(([, , , selector]) => prop.matches(selector));
            const entry = beat > 0 ? cues[index][beat] - .2 : .25 + propIndex * .09;
            timeline.fromTo(prop, {y: reducedMotion ? 0 : 18, opacity: 0}, {y: 0, opacity: 1, duration: reducedMotion ? .15 : 1.1, ease: 'power2.out'}, scene.start + entry);
          });
          timeline.fromTo(shot.querySelector('.scene-sequence'), {opacity: 0, y: reducedMotion ? 0 : 8}, {opacity: 1, y: 0, duration: .7}, scene.start + .5);
          if (scene.id === 'career') shot.querySelectorAll('.product-block').forEach((node, beatIndex) => {
            timeline.fromTo(node, {opacity: .25, y: reducedMotion ? 0 : 6}, {opacity: 1, y: 0, duration: .65}, scene.start + cues[index][beatIndex]);
          });
          if (scene.id === 'latex') {
            timeline.fromTo(shot.querySelector('.editor-code'), {clipPath: 'inset(0 0 90% 0)'}, {clipPath: 'inset(0 0 0% 0)', duration: reducedMotion ? .15 : Math.max(1, cues[index][2]), ease: 'steps(10)'}, scene.start + .65);
            timeline.fromTo(shot.querySelector('.paper'), {opacity: .2, y: reducedMotion ? 0 : 8}, {opacity: 1, y: 0, duration: .8}, scene.start + cues[index][3] - .2);
          }
          if (scene.id === 'medical') timeline.fromTo(shot.querySelector('.chat.answer'), {opacity: 0, y: reducedMotion ? 0 : 8}, {opacity: 1, y: 0, duration: .8}, scene.start + cues[index][2] - .2);
          if (scene.id === 'swecha') timeline.fromTo(shot.querySelector('.pipeline-meter div:last-child'), {scaleX: .87}, {scaleX: 1, duration: reducedMotion ? .15 : 1.2}, scene.start + cues[index][2]);
          if (scene.id === 'music') timeline.fromTo(shot.querySelector('.playback-line span'), {scaleX: 0}, {scaleX: 1, duration: scene.duration - cues[index][2], ease: 'none'}, scene.start + cues[index][2]);
          if (!reducedMotion) {
            timeline.fromTo(shot.querySelector('.scene-art'), {scale: .985, x: 0}, {scale: 1, x: -4, duration: scene.duration, ease: 'sine.inOut'}, scene.start);
            focusNodes[index].forEach((nodes, beatIndex) => {
              const htmlNodes = nodes.filter(node => node.namespaceURI === 'http://www.w3.org/1999/xhtml' && !node.classList.contains('prop'));
              timeline.fromTo(htmlNodes, {filter: 'brightness(.9)'}, {filter: 'brightness(1)', duration: .6}, scene.start + Math.max(.2, cues[index][beatIndex] - .2));
            });
          }
          timeline.fromTo(root, {'--accent': SCENES[Math.max(0, index - 1)].accent}, {'--accent': scene.accent, duration: .8}, scene.start);
          if (index < SCENES.length - 1) timeline.to(shot, {autoAlpha: 0, duration: reducedMotion ? .15 : .65}, scene.end - (reducedMotion ? .15 : .2));
        });
      }, root);
      viewportObserver.observe(root);
      const scrollPortrait = () => { if (viewport.width <= 600) draw(); };
      root.addEventListener('scroll', scrollPortrait, true);
      return {
        timeline,
        seek(time) { timeline.time(clamp(time, 0, DURATION), false); draw(); },
        destroy() { root.removeEventListener('scroll', scrollPortrait, true); viewportObserver.disconnect(); context.revert(); orbit.pause(); waveform.pause(); anime.remove(root.querySelector('.orbit-rotation')); anime.remove(root.querySelectorAll('.waveform i')); atmosphere.destroy(); }
      };
    }

    async function chooseVoiceProfile() {
      const mobile = Boolean(navigator.userAgentData?.mobile || (navigator.maxTouchPoints > 1 && window.matchMedia('(pointer: coarse)').matches));
      const memory = Number(navigator.deviceMemory) || 4;
      const cores = Number(navigator.hardwareConcurrency) || 2;
      const metered = Boolean(navigator.connection?.saveData || /(^|-)2g$/.test(navigator.connection?.effectiveType || ''));
      let safe = false, adapter = null;
      try {
        safe = Number(localStorage.getItem('rasheed-voice-safe-until')) > Date.now();
        const unfinished = parseInt(localStorage.getItem('rasheed-voice-inflight'), 10);
        if (Number.isFinite(unfinished) && Date.now() - unfinished < 86400000) safe = true;
      } catch {}
      try { adapter = await within(navigator.gpu?.requestAdapter({powerPreference: mobile ? 'low-power' : 'high-performance'}), 1500); } catch {}
      const small = mobile || memory <= 4 || cores <= 4 || safe || metered;
      const backend = adapter && !small ? 'webgpu' : 'wasm';
      const precision = backend === 'webgpu' ? 'fp32' : 'q8';
      return {backend, precision, small, mobile, chunkChars: small ? 160 : 220, fps: small ? 30 : 60,
        nativeRecommended: metered || memory <= 2,
        requireExplicitModel: memory <= 2 || metered,
        label: `English · Michael · ${precision.toUpperCase()} / ${backend === 'webgpu' ? 'GPU' : 'CPU'}`};
    }

    function openVoiceCache() {
      return new Promise(resolve => {
        let settled = false;
        const timeout = setTimeout(() => { settled = true; resolve(null); }, 1200);
        try {
          const request = indexedDB.open('rasheed-voice-clips-v3', 1);
          request.onupgradeneeded = () => { request.result.createObjectStore('clips', {keyPath: 'key'}).createIndex('touched', 'touched'); };
          request.onsuccess = () => {
            clearTimeout(timeout);
            if (settled) request.result.close();

        };
      }, []);

      useEffect(() => {
        const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
        const change = event => setReducedMotion(event.matches);
        preference.addEventListener('change', change);
        return () => preference.removeEventListener('change', change);
      }, []);

      useEffect(() => {
        function keydown(event) {
          if (!startedRef.current) return;
          if (exportRef.current || event.target.closest?.('.export-note, .export-control')) return;
          if (event.altKey || event.ctrlKey || event.metaKey) return;
          const target = event.target;
          if (target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"], .play-gate, .export-note')) return;
          if (event.code === 'Space' && target instanceof Element && target.closest('button, a')) return;
          if (event.code === 'Space') { event.preventDefault(); if (!event.repeat) togglePlayback(); }
          else if (event.code === 'ArrowRight') { event.preventDefault(); skip(1, event.shiftKey); }
          else if (event.code === 'ArrowLeft') { event.preventDefault(); skip(-1, event.shiftKey); }
          else if (event.code === 'Home') { event.preventDefault(); seek(0); }
          else if (event.code === 'End') { event.preventDefault(); seek(SCENES[SCENES.length - 1].start); }
        }
        function visibility() {
          if (exportRef.current) return;
          const clock = audioRef.current;
          if (!clock?.ready) return;
          if (document.hidden) {
            resumeAfterHidden.current = clock.wanted; clock.pause(); clock.pipeline?.cancelBackground(); setPlaying(false);
          } else if (resumeAfterHidden.current) {
            resumeAfterHidden.current = false;
            void beginPlayback().catch(audioFailure);
          }
        }
        window.addEventListener('keydown', keydown);
        document.addEventListener('visibilitychange', visibility);
        return () => { window.removeEventListener('keydown', keydown); document.removeEventListener('visibilitychange', visibility); };
      }, []);

      function beginScrub(event) {
        if (exportRef.current) return;
        const clock = audioRef.current;
        if (!startedRef.current || !clock?.ready) return;
        dragRef.current = true; resumeAfterDrag.current = clock.wanted; clock.pause(); setPlaying(false);
        event.currentTarget.setPointerCapture(event.pointerId); showControls();
      }
      function finishScrub() {
        if (!dragRef.current) return;
        dragRef.current = false;
        const clock = audioRef.current;
        if (clock && resumeAfterDrag.current && clock.time() < DURATION) void beginPlayback().catch(audioFailure);
        syncPlayback(); showControls();
      }
      function rangeKey(event) {
        if (event.code === 'Space') { event.preventDefault(); if (!event.repeat) togglePlayback(); }
        else if (event.code === 'ArrowRight' || event.code === 'ArrowLeft') {
          event.preventDefault(); skip(event.code === 'ArrowRight' ? 1 : -1, event.shiftKey);
        }
      }
      const gateVisible = voiceOpen || !hasStarted || narrationStatus.phase === 'error';
      const preparing = narrationStatus.phase === 'loading';
      useEffect(() => {
        if (!gateVisible) return;
        const previous = document.activeElement;
        const dialog = cinemaRef.current?.querySelector('.play-gate');
        const controls = () => [...dialog.querySelectorAll('button:not(:disabled), a[href]')];
        controls()[0]?.focus();
        const trapFocus = event => {
          if (event.key !== 'Tab') return;
          const available = controls();
          const first = available[0], last = available[available.length - 1];
          if (!first) { event.preventDefault(); return; }
          if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', trapFocus);
        return () => {
          document.removeEventListener('keydown', trapFocus);
          if (previous?.isConnected) previous.focus();
          else cinemaRef.current?.querySelector('.export-control button')?.focus();
        };
      }, [gateVisible]);
      return <main ref={cinemaRef} className={`cinema ${lowPower ? 'low-power' : ''} ${exporting ? 'is-exporting' : ''} ${gateVisible || hudVisible || exportOpen ? '' : 'is-idle'}`} aria-label="Rasheed Ali Shaik cinematic portfolio" aria-describedby="cinema-instructions" onPointerMove={showControls} onPointerDown={showControls} onFocusCapture={showControls} onPointerLeave={() => { if (!dragRef.current) setHudVisible(false); }} onClick={event => { if (!event.target.closest('a, button, input, select, video, .hud, .play-gate, .buffering-note, .export-note, .export-control')) togglePlayback(); }}>
        <p id="cinema-instructions" className="sr-only">A six-chapter portfolio narrated in English. Activate Play to start. Kokoro uses full precision on the GPU or eight-bit precision on the CPU in a background worker. Adaptive buffering aims to keep fifteen seconds ready. Limited devices prefer an installed English voice. Open Voice to change narration or regenerate fresh full-precision CPU audio if speech sounds wrong. Space pauses or plays. Arrows seek five seconds; Shift plus an arrow navigates chapters. Home restarts; End opens contact information. Device voice seeking is approximate. Duration is estimated until narration is prepared. Move the pointer or focus a control to reveal playback controls.</p>
        <canvas ref={canvasRef} className="ambient" aria-hidden="true"/>
        <div className="atmosphere"/>
        <div className="stage">{SCENES.map((scene,index) => <Shot key={scene.id} scene={scene} index={index} active={!gateVisible && activeScene === index}/>)}</div>
        <Character/>
        <div className="vignette"/><div className="grain"/>
        {!gateVisible && <div className="export-control">
          <button className="export-button" disabled={exporting} onClick={() => { audioRef.current?.pause(); syncPlayback(); setExportOpen(false); setVoiceOpen(true); }} aria-haspopup="dialog">Voice · EN</button>
          {exportStatus.phase === 'ready' ? <a className="export-button" href={exportStatus.url} download="rasheed-ali-shaik-a-film-in-code.mp4">Download Now ↓</a> : <button className="export-button" onClick={() => setExportOpen(open => !open)} aria-expanded={exportOpen} aria-controls="export-panel">{exporting ? `Exporting · ${Math.floor(exportStatus.percent)}%` : 'Export film ↗'}</button>}
          {exportStatus.phase === 'ready' && <button className="export-button" onClick={() => setExportOpen(open => !open)} aria-label="Preview exported film" aria-expanded={exportOpen}>Preview</button>}
        </div>}
        {!gateVisible && exportOpen && <section className="export-note" id="export-panel" aria-label="MP4 export">
          <p><strong>{exportStatus.phase === 'ready' ? 'Your film is ready.' : 'Take the complete film with you.'}</strong></p>
          <p role="status" aria-live="polite">{exportStatus.message || 'Prepare an MP4 with all 14 scenes and the complete Kokoro voiceover. Playback pauses during export. Each frame is rendered offline; this can take longer than the film itself.'}</p>
          {exporting && <progress max="100" value={exportStatus.percent} aria-label="MP4 preparation progress"/>}
          {exportStatus.phase === 'ready' && <><video src={exportStatus.url} controls playsInline preload="metadata" aria-label="Completed MP4 preview" onPlay={() => { audioRef.current?.pause(); syncPlayback(); }}/><a className="export-button" href={exportStatus.url} download="rasheed-ali-shaik-a-film-in-code.mp4">Download Now ↓</a></>}
          {!exporting && exportStatus.phase !== 'ready' && <>
            <p><label>Export quality <select value={exportResolution} onChange={event => setExportResolution(event.target.value)} style={{marginLeft: 10, background: '#202a22', color: '#eef0e5', padding: 6, border: '1px solid #46523b'}}><option value="1080">1080p · 30 fps</option><option value="720">720p · 30 fps · Smaller</option></select></label></p>
            <p>Keep this tab open. Download Now appears only after both tracks finish. Files are held in memory until you download or close the page.</p>
            {audioRef.current?.pipeline ? <button className="export-button" onClick={prepareDownload}>Prepare MP4</button> : <button className="export-button" onClick={() => { setExportStatus({phase: 'idle', percent: 0, message: ''}); void startFilm('kokoro'); }}>Use Kokoro for export</button>}
          </>}
          {exporting ? <button className="export-button" onClick={cancelExport}>Cancel export</button> : <button className="play-gate-cancel" onClick={() => setExportOpen(false)}>Close</button>}
        </section>}
        {flash && <div className="control-flash" aria-hidden="true">{flash}</div>}
        {gateVisible && <div className="play-gate" role="dialog" aria-modal="true" aria-labelledby="play-gate-title" aria-describedby="play-gate-description" aria-busy={preparing}>
          <h2 className="play-gate-heading" id="play-gate-title"><span>RASHEED ALI SHAIK / A FILM IN CODE</span>{preparing ? 'Giving the story a voice.' : 'Every idea begins somewhere.'}</h2>
          <button className="play-gate-button" autoFocus disabled={preparing} onClick={startFilm} aria-label={preparing ? 'Preparing narrated film' : narrationStatus.phase === 'error' ? 'Retry narrated playback' : 'Play film with audio'}>
            {preparing ? <span className="loading-count">VOICE</span> : <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.5v15L20 12z"/></svg>}
          </button>
          <div className="play-gate-copy">
            <p className="play-gate-label">{preparing ? 'Preparing your narrated premiere' : narrationStatus.phase === 'error' ? 'Narration needs your attention' : 'Play film · Sound on'}</p>
            <p id="play-gate-description" className={`play-gate-message ${narrationStatus.phase === 'error' ? 'play-gate-error' : ''}`} role="status" aria-live="polite">{narrationStatus.message || 'English narration, generated locally. Full-precision GPU or memory-saving CPU synthesis, with adaptive buffering for smooth playback.'}</p>
            <p className="play-gate-note">{narrationStatus.label || 'ENGLISH / AUTOMATIC HARDWARE SELECTION'}<br/>Slow devices need a longer preload. Clips stay cached locally.<br/>The first model download takes time; an installed English voice avoids it.<br/>Synthetic narration, not Rasheed’s voice. No microphone or text upload.<br/>Speech sounds wrong? Regenerate on CPU without reusing cached clips.<br/>Full-precision CPU recovery needs a larger download and more memory.</p>
            <div className="voice-options">{window.speechSynthesis && <button className="play-gate-cancel" onClick={() => startFilm('device')}>Device English voice</button>}<button className="play-gate-cancel" onClick={() => startFilm('kokoro')}>Kokoro English voice</button><button className="play-gate-cancel" onClick={() => startFilm('cpu')}>Regenerate English · CPU</button></div>
            {preparing && <button className="play-gate-cancel" onClick={cancelPreparation}>Cancel preparation</button>}
            {voiceOpen && !preparing && hasStarted && <button className="play-gate-cancel" onClick={() => setVoiceOpen(false)}>Back to film</button>}
          </div>
        </div>}
        {!gateVisible && narrationStatus.phase === 'buffering' && <div className="buffering-note" role="status"><div>{narrationStatus.message}</div>{window.speechSynthesis && <button className="play-gate-cancel" onClick={() => startFilm('device')}>Switch to instant device voice</button>}</div>}
        <div className={`hud ${hudVisible ? 'visible' : ''}`} hidden={gateVisible} onPointerMove={showControls}>
          <div className="voice-buffer" ref={voiceBufferRef}/>
          <div className="hud-meta">
            <div className="transport"><button aria-label="Back five seconds" title="Back 5 seconds (←)" onClick={() => skip(-1)}>‹</button><button aria-label={playing ? 'Pause' : 'Play'} title="Play / pause (Space)" onClick={togglePlayback}>{playing ? 'Ⅱ' : '▶'}</button><button aria-label="Forward five seconds" title="Forward 5 seconds (→)" onClick={() => skip(1)}>›</button></div>
            <span className="hud-label">{String(SCENES[activeScene].chapter + 1).padStart(2,'0')} / {CHAPTERS[SCENES[activeScene].chapter]}</span>
            <span className="hud-help">SPACE — PAUSE &nbsp; ← → — SEEK &nbsp; SHIFT ← → — CHAPTERS</span>
            <span className="timecode" ref={timeRef}>0:00 / ~{timecode(DURATION)}</span>
          </div>
          <div className="scrub-wrap"><div className="scrub-track"><div className="scrub-fill" ref={fillRef}/>{CHAPTER_STARTS.slice(1).map(start => <i className="chapter-tick" key={start} style={{left: `${start / DURATION * 100}%`}}/>)}<div className="scrub-dot" ref={dotRef}/></div><input ref={rangeRef} className="scrubber" type="range" min="0" max={DURATION} step="0.1" defaultValue="0" aria-label="Film position" onChange={event => seek(Number(event.target.value))} onPointerDown={beginScrub} onPointerUp={finishScrub} onPointerCancel={finishScrub} onLostPointerCapture={finishScrub} onKeyDown={rangeKey}/></div>
        </div>
        <span className="sr-only" role="status" aria-live="polite">{playing ? 'Playing' : 'Paused'} — {CHAPTERS[SCENES[activeScene].chapter]}</span>
      </main>;
    }

    class CinemaBoundary extends React.Component {
      constructor(props) { super(props); this.state = { failed: false }; }
      static getDerivedStateFromError() { return { failed: true }; }
      componentDidCatch(error) { console.error('Cinema could not initialize:', error); }
      render() {
        if (this.state.failed) return <div className="boot"><div className="boot-mark">RA</div><p>This browser couldn’t open the film.<br/>Try reloading in a current browser, or contact Rasheed directly.</p><a href="mailto:sk.rasheedali@gmail.com">sk.rasheedali@gmail.com ↗</a><button onClick={() => location.reload()}>Reload film</button></div>;
        return this.props.children;
      }
    }
    if (!window.gsap || !window.anime || !window.ReactDOM) window.showCinemaError();
    else ReactDOM.createRoot(document.getElementById('root')).render(<CinemaBoundary><App/></CinemaBoundary>);
  </script>
</body>
</html>
