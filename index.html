<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f4f4a" />
    <meta name="robots" content="noindex, follow" />
    <title>Sreemantha Hospital — Fertility, Women & Child Care</title>
    <meta
      name="description"
      content="Advanced fertility, maternity, neonatal and pediatric care in Khammam — available 24/7."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #18312f;
        --deep: #0d4945;
        --teal: #0f6059;
        --mint: #dbeee9;
        --lime: #d8edb1;
        --cream: #f6f3ea;
        --paper: #fffdf8;
        --coral: #ef765f;
        --line: rgba(24, 49, 47, 0.12);
        --shadow: 0 24px 70px rgba(13, 73, 69, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: auto;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
      }
      body.modal-open {
        overflow: hidden;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        max-width: 100%;
      }
      ::selection {
        background: var(--coral);
        color: #fff;
      }
      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      }
      .container {
        width: min(1180px, calc(100% - 48px));
        margin: auto;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 11px;
        font-weight: 800;
        color: var(--teal);
      }
      .eyebrow:before {
        content: "";
        width: 28px;
        height: 2px;
        background: var(--coral);
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1,
      h2,
      h3 {
        font-family: "Manrope", sans-serif;
      }
      h2 {
        font-size: clamp(38px, 5vw, 68px);
        line-height: 1.02;
        letter-spacing: -0.055em;
        margin: 18px 0 22px;
      }
      p {
        line-height: 1.7;
        color: #637371;
      }
      .muted {
        color: #73817f;
      }
      .section {
        padding: 110px 0;
      }
      .round-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        transition: 0.25s;
      }
      .round-btn:hover {
        background: var(--deep);
        color: #fff;
        transform: rotate(8deg);
      }
      .btn {
        border: 0;
        border-radius: 999px;
        padding: 14px 21px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-weight: 700;
        transition: 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn-primary {
        background: var(--coral);
        color: white;
        box-shadow: 0 12px 25px rgba(239, 118, 95, 0.22);
      }
      .btn-dark {
        background: var(--deep);
        color: white;
      }
      .btn-light {
        background: #fff;
        color: var(--deep);
      }
      .btn-outline {
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        background: transparent;
      }
      .icon {
        width: 18px;
        height: 18px;
        stroke-width: 1.8;
      }
      .topbar {
        height: 36px;
        background: var(--deep);
        color: #d9ece8;
        font-size: 12px;
        display: flex;
        align-items: center;
      }
      .topbar .container {
        display: flex;
        justify-content: space-between;
      }
      .topbar span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .topbar-right {
        display: flex;
        gap: 22px;
      }
      .navbar {
        height: 82px;
        position: absolute;
        top: 36px;
        left: 0;
        right: 0;
        z-index: 20;
        color: white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      }
      .navbar .container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 43px;
        height: 43px;
        border-radius: 15px 15px 15px 4px;
        background: var(--lime);
        color: var(--deep);
        display: grid;
        place-items: center;
        position: relative;
        font-size: 22px;
        font-weight: 800;
      }
      .brand-mark:after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--coral);
        position: absolute;
        right: -2px;
        top: -2px;
      }
      .brand strong {
        display: block;
        font-family: "Manrope";
        font-size: 18px;
        line-height: 1;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 13px;
        font-weight: 600;
      }
      .nav-links a {
        position: relative;
      }
      .nav-links a:after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -8px;
        width: 0;
        height: 2px;
        background: var(--lime);
        transition: 0.25s;
      }
      .nav-links a:hover:after {
        width: 100%;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .menu-btn {
        display: none;
      }
      .hero {
        min-height: 820px;
        height: 100vh;
        max-height: 960px;
        background: var(--deep);
        color: #fff;
        position: relative;
        overflow: hidden;
      }
      .hero-media {
        position: absolute;
        inset: 0;
      }
      .hero-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 26%;
        filter: saturate(0.8);
      }
      .hero-media:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(6, 48, 45, 0.94) 0%,
            rgba(6, 48, 45, 0.76) 39%,
            rgba(6, 48, 45, 0.12) 75%
          ),
          linear-gradient(0deg, rgba(6, 48, 45, 0.65), transparent 45%);
      }
      .hero-orb {
        position: absolute;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        right: -80px;
        top: 170px;
      }
      .hero-orb:before,
      .hero-orb:after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        inset: 55px;
      }
      .hero-orb:after {
        inset: 110px;
      }
      .hero .container {
        height: 100%;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
      }
      .hero-copy {
        max-width: 720px;
        padding-top: 100px;
      }
      .hero .eyebrow {
        color: var(--lime);
      }
      .hero h1 {
        font-size: clamp(55px, 7.6vw, 104px);
        letter-spacing: -0.072em;
        line-height: 0.9;
        margin: 27px 0 30px;
        max-width: 820px;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--lime);
      }
      .hero-copy > p {
        color: rgba(255, 255, 255, 0.75);
        font-size: 18px;
        max-width: 560px;
      }
      .hero-ctas {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .hero-trust {
        position: absolute;
        bottom: 36px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #fff;
      }
      .avatar-stack {
        display: flex;
        align-items: center;
      }
      .avatar-stack img {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--deep);
        margin-left: -10px;
      }
      .avatar-stack img:first-child {
        margin-left: 0;
      }
      .trust-copy {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
      }
      .trust-copy b {
        font-size: 15px;
        display: block;
      }
      .hero-side-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 15px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .hero-side-card .pulse {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--coral);
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 8px rgba(239, 118, 95, 0.15);
      }
      .hero-side-card small {
        display: block;
        color: rgba(255, 255, 255, 0.65);
      }
      .ticker {
        background: var(--lime);
        padding: 17px 0;
        overflow: hidden;
        white-space: nowrap;
      }
      .ticker-track {
        display: inline-flex;
        align-items: center;
        gap: 34px;
        animation: ticker 28s linear infinite;
        font-family: "Manrope";
        font-weight: 700;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }
      .ticker i {
        font-style: normal;
        color: var(--coral);
      }
      @keyframes ticker {
        to {
          transform: translateX(-50%);
        }
      }
      .intro-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 90px;
        align-items: center;
      }
      .intro-visual {
        position: relative;
        height: 650px;
      }
      .intro-main {
        width: 82%;
        height: 570px;
        object-fit: cover;
        border-radius: 180px 180px 28px 28px;
      }
      .intro-float {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 230px;
        height: 280px;
        object-fit: cover;
        border: 9px solid var(--paper);
        border-radius: 26px;
      }
      .year-badge {
        position: absolute;
        right: 0;
        top: 40px;
        background: var(--coral);
        color: #fff;
        width: 126px;
        height: 126px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: rotate(8deg);
      }
      .year-badge strong {
        font: 800 28px "Manrope";
      }
      .year-badge span {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .intro-copy p {
        font-size: 16px;
      }
      .principles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 32px 0;
      }
      .principle {
        padding: 19px;
        border-radius: 18px;
        background: var(--cream);
        display: flex;
        gap: 13px;
        align-items: center;
        font-weight: 700;
        font-size: 13px;
      }
      .principle-icon {
        min-width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--mint);
        display: grid;
        place-items: center;
        color: var(--teal);
      }
      .services {
        background: var(--cream);
        overflow: hidden;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 45px;
      }
      .section-head h2 {
        max-width: 700px;
        margin-bottom: 0;
      }
      .section-head p {
        max-width: 380px;
      }
      .services-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .service-card {
        background: var(--paper);
        border-radius: 24px;
        padding: 30px;
        min-height: 330px;
        position: relative;
        overflow: hidden;
        border: 1px solid transparent;
        transition: 0.35s;
        display: flex;
        flex-direction: column;
      }
      .service-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow);
        border-color: rgba(15, 96, 89, 0.12);
      }
      .service-card.featured {
        background: var(--deep);
        color: #fff;
      }
      .service-num {
        font: 700 11px "Manrope";
        color: var(--coral);
        letter-spacing: 0.16em;
      }
      .service-icon {
        width: 62px;
        height: 62px;
        border-radius: 20px;
        background: var(--mint);
        display: grid;
        place-items: center;
        color: var(--teal);
        margin: 28px 0;
      }
      .featured .service-icon {
        background: var(--lime);
      }
      .service-card h3 {
        font-size: 22px;
        margin-bottom: 10px;
      }
      .service-card p {
        font-size: 14px;
      }
      .featured p {
        color: rgba(255, 255, 255, 0.64);
      }
      .service-link {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
      }
      .service-link i {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-style: normal;
      }
      .featured .service-link i {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .stats {
        background: var(--deep);
        color: #fff;
        padding: 70px 0;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .stat {
        padding: 14px 35px;
        border-right: 1px solid rgba(255, 255, 255, 0.14);
      }
      .stat:first-child {
        padding-left: 0;
      }
      .stat:last-child {
        border: 0;
      }
      .stat strong {
        font: 700 clamp(42px, 5vw, 68px) "Manrope";
        letter-spacing: -0.06em;
        color: var(--lime);
        display: block;
      }
      .stat span {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.62);
      }
      .doctor-section {
        position: relative;
      }
      .doctor-layout {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 50px;
      }
      .doctor-intro {
        position: sticky;
        top: 40px;
        height: max-content;
      }
      .doctor-list {
        display: flex;
        flex-direction: column;
      }
      .doctor {
        display: grid;
        grid-template-columns: 160px 1fr 54px;
        gap: 25px;
        align-items: center;
        padding: 25px 0;
        border-bottom: 1px solid var(--line);
        transition: 0.25s;
      }
      .doctor:hover {
        padding-left: 14px;
      }
      .doctor img {
        width: 160px;
        height: 142px;
        object-fit: cover;
        border-radius: 18px;
        filter: saturate(0.82);
      }
      .doctor h3 {
        font-size: 23px;
        margin: 0 0 6px;
      }
      .doctor p {
        font-size: 13px;
        margin: 0;
      }
      .doctor-tags {
        display: flex;
        gap: 7px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .tag {
        padding: 6px 10px;
        background: var(--mint);
        color: var(--teal);
        border-radius: 99px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .facilities {
        background: #e5f0ec;
      }
      .facility-stage {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        min-height: 670px;
        background: var(--deep);
        border-radius: 32px;
        overflow: hidden;
      }
      .facility-image {
        position: relative;
        overflow: hidden;
      }
      .facility-image img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .facility-image:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 60%,
          rgba(13, 73, 69, 0.65)
        );
      }
      .facility-content {
        padding: 64px 55px;
        color: #fff;
        display: flex;
        flex-direction: column;
      }
      .facility-content .eyebrow {
        color: var(--lime);
      }
      .facility-content h2 {
        font-size: 52px;
      }
      .facility-content > p {
        color: rgba(255, 255, 255, 0.65);
      }
      .facility-tabs {
        margin-top: auto;
      }
      .facility-tab {
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        padding: 19px 0;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        gap: 12px;
        color: rgba(255, 255, 255, 0.52);
        transition: 0.25s;
      }
      .facility-tab.active,
      .facility-tab:hover {
        color: #fff;
      }
      .facility-tab strong {
        font: 600 17px "Manrope";
      }
      .facility-tab b {
        font-size: 11px;
        color: var(--coral);
      }
      .journey-head {
        text-align: center;
        max-width: 760px;
        margin: 0 auto 65px;
      }
      .journey-head .eyebrow {
        justify-content: center;
      }
      .journey-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        position: relative;
      }
      .journey-grid:before {
        content: "";
        position: absolute;
        height: 1px;
        background: var(--line);
        top: 37px;
        left: 11%;
        right: 11%;
      }
      .step {
        text-align: center;
        padding: 0 20px;
        position: relative;
      }
      .step-num {
        width: 74px;
        height: 74px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto 27px;
        position: relative;
        font: 800 18px "Manrope";
        color: var(--teal);
        transition: 0.25s;
      }
      .step:hover .step-num {
        background: var(--coral);
        color: #fff;
        border-color: var(--coral);
        transform: scale(1.07);
      }
      .step h3 {
        font-size: 17px;
      }
      .step p {
        font-size: 13px;
      }
      .testimonial-section {
        background: var(--cream);
      }
      .testimonial-wrap {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: 70px;
        align-items: center;
      }
      .patient-collage {
        height: 600px;
        position: relative;
      }
      .patient-collage .main-patient {
        width: 78%;
        height: 100%;
        object-fit: cover;
        border-radius: 28px 160px 28px 28px;
      }
      .rating-float {
        position: absolute;
        right: 0;
        bottom: 50px;
        background: var(--paper);
        border-radius: 24px;
        padding: 25px;
        width: 230px;
        box-shadow: var(--shadow);
      }
      .rating-float strong {
        font: 800 42px "Manrope";
        color: var(--teal);
      }
      .stars {
        color: #eaa83f;
        letter-spacing: 2px;
      }
      .quote-mark {
        font: 800 90px Georgia;
        color: var(--mint);
        height: 60px;
      }
      .testimonial blockquote {
        font: 500 clamp(25px, 3vw, 41px)/1.3 "Manrope";
        letter-spacing: -0.035em;
        margin: 0 0 30px;
      }
      .testimonial-person {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      .testimonial-person strong {
        display: block;
      }
      .testimonial-person span {
        font-size: 12px;
        color: #80908d;
      }
      .testimonial-nav {
        display: flex;
        gap: 8px;
      }
      .insurance-strip {
        padding: 48px 0;
        border-bottom: 1px solid var(--line);
      }
      .insurance-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 25px;
      }
      .insurance-row > span {
        font-weight: 700;
        font-size: 12px;
        max-width: 120px;
      }
      .insurer {
        font: 800 18px "Manrope";
        color: #899795;
        letter-spacing: -0.04em;
      }
      .insurer b {
        color: var(--teal);
      }
      .contact-section {
        padding: 100px 0 0;
      }
      .contact-card {
        background: var(--deep);
        border-radius: 34px;
        color: white;
        display: grid;
        grid-template-columns: 1fr 0.9fr;
        overflow: hidden;
      }
      .contact-copy {
        padding: 75px;

      const defaultCMS = {

        const parts = text.split(/(extraordinary)/i);
        return (
          <>
            {parts.map((part, i) =>
              /^extraordinary$/i.test(part) ? (
                <em key={i}>{part}</em>

              ),
            )}

        );
      };
      function useIcons(dep) {
        useEffect(() => {
          window.lucide &&
            window.lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
        }, [dep]);
      }
      function useAnimations(view) {
        useEffect(() => {
          if (view !== "site" || !window.gsap || !window.ScrollTrigger) return;
          gsap.registerPlugin(ScrollTrigger);
          let lenis;
          let frame;
          if (window.Lenis) {
            lenis = new Lenis({ duration: 1.15, smoothWheel: true });
            const raf = (t) => {
              lenis.raf(t);
              frame = requestAnimationFrame(raf);
            };
            frame = requestAnimationFrame(raf);
            lenis.on("scroll", ScrollTrigger.update);
          }
          const ctx = gsap.context(() => {
            gsap.from(".hero-reveal", {
              y: 55,
              opacity: 0,
              duration: 1.05,
              stagger: 0.12,
              ease: "power3.out",
              delay: 0.2,
            });
            gsap.utils
              .toArray(".section .reveal")
              .forEach((el) =>
                gsap.from(el, {
                  scrollTrigger: { trigger: el, start: "top 87%" },
                  y: 45,
                  opacity: 0,
                  duration: 0.8,
                  ease: "power3.out",
                }),
              );
            gsap.utils
              .toArray(".service-card")
              .forEach((el, i) =>
                gsap.from(el, {
                  scrollTrigger: { trigger: el, start: "top 90%" },
                  y: 45,
                  opacity: 0,
                  duration: 0.65,
                  delay: (i % 3) * 0.08,
                }),
              );
            gsap.to(".hero-media img", {
              scale: 1.09,
              scrollTrigger: {
                trigger: ".hero",
                scrub: 1,
                start: "top top",
                end: "bottom top",
              },
            });
          });
          return () => {
            ctx.revert();
            cancelAnimationFrame(frame);
            lenis && lenis.destroy();
          };
        }, [view]);
      }
      const MockAPI = {
        wait: (data, ms = 550) =>
          new Promise((r) => setTimeout(() => r({ ok: true, data }), ms)),
        saveCMS: (data) => MockAPI.wait(data),

          MockAPI.wait({
            ...data,
            id: "APT-" + Math.floor(1000 + Math.random() * 9000),
          }),

          ),
      };

          ["#admin", "#dashboard"].includes(location.hash) ? "login" : "site",

            return (
              hydrateCMS(JSON.parse(localStorage.getItem("sreemantha-cms")) || {})
            );
          } catch {
            return hydrateCMS({});
          }
        });
        const [appointments, setAppointments] = useState(appointmentSeed);
        const [doctors, setDoctors] = useState(() => loadStore("sreemantha-doctors", doctorSeed));
        const [blogs, setBlogs] = useState(() => loadStore("sreemantha-blogs", []));
        const [toast, setToast] = useState("");
        const notify = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(""), 2800);
        };
        const go = (v) => {
          setView(v);
          location.hash =
            v === "site" ? "" : v === "login" ? "admin" : "dashboard";
          window.scrollTo(0, 0);
        };
        useIcons(view + appointments.length);
        useAnimations(view === "site" && route.startsWith("#blog") ? "blog" : view);
        useEffect(() => { try { localStorage.removeItem("sreemantha-appts"); } catch {} }, []);
        useEffect(() => {
          let robots = document.querySelector('meta[name="robots"]');
          if (!robots) { robots = document.createElement("meta"); robots.name = "robots"; document.head.appendChild(robots); }
          robots.content = "noindex, follow";
          document.title = view === "site" ? "Sreemantha Hospital — Website demo" : view === "login" ? "Sign in | Sreemantha" : "Administration | Sreemantha";
        }, [view]);

      function BookingModal({ onClose, onBook, services = serviceSeed }) {
        const dialog = useRef(null);
        const [form, setForm] = useState({
          name: "",
          phone: "",
          service: services[0]?.title || "",
          date: "",
          message: "",
        });
        const [loading, setLoading] = useState(false);
        useIcons();
        useEffect(() => {
          const previousFocus = document.activeElement;
          document.body.classList.add("modal-open");
          dialog.current?.querySelector("input")?.focus();
          const keydown = (event) => {
            if (event.key === "Escape") { event.preventDefault(); onClose(); }
            if (event.key !== "Tab") return;
            const controls = [...dialog.current.querySelectorAll('button:not([disabled]), input, select, textarea, a[href]')];
            const first = controls[0], last = controls[controls.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          };
          document.addEventListener("keydown", keydown);
          return () => { document.body.classList.remove("modal-open"); document.removeEventListener("keydown", keydown); previousFocus?.focus(); };
        }, []);
        const submit = async (e) => {
          e.preventDefault();
          setLoading(true);
          await onBook(form);
        };
        return (
          <div
            className="modal-backdrop"
            onMouseDown={(e) => e.target === e.currentTarget && onClose()}
          >
            <form className="modal" ref={dialog} role="dialog" aria-modal="true" aria-label="Request a demo appointment" onSubmit={submit}>
              <button
                type="button"
                className="round-btn modal-close"
                aria-label="Close appointment form"
                onClick={onClose}
              >
                <Icon name="x" />
              </button>
              <div className="eyebrow">Request an appointment</div>
              <h3>How can we care for you?</h3>
              <p>
                Demo only: use fictional details. No request is sent to the
                hospital; entries disappear on refresh.
              </p>
              <div className="form-grid">
                <div className="field">
                  <label htmlFor="booking-name">Patient name</label>
                  <input
                    id="booking-name"
                    required
                    placeholder="Full name"
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                  />
                </div>
                <div className="field">
                  <label htmlFor="booking-phone">Phone number</label>
                  <input
                    id="booking-phone"
                    required
                    type="tel"
                    placeholder="+91 00000 00000"
                    value={form.phone}
                    onChange={(e) =>
                      setForm({ ...form, phone: e.target.value })
                    }
                  />
                </div>
                <div className="field">
                  <label htmlFor="booking-department">Department</label>
                  <select
                    id="booking-department"
                    value={form.service}
                    onChange={(e) =>
                      setForm({ ...form, service: e.target.value })
                    }
                  >
                    {services.map((s) => (
                      <option key={s.title}>{s.title}</option>
                    ))}
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="booking-date">Preferred date</label>
                  <input
                    id="booking-date"
                    required
                    type="date"
                    min={new Date().toLocaleDateString("en-CA")}
                    value={form.date}
                    onChange={(e) => setForm({ ...form, date: e.target.value })}
                  />
                </div>
                <div className="field full">
                  <label htmlFor="booking-note">Scheduling note (no medical details)</label>
                  <textarea
                    id="booking-note"
                    placeholder="Demo only — do not enter diagnoses or health information."
                    value={form.message}
                    onChange={(e) =>
                      setForm({ ...form, message: e.target.value })
                    }
                  />
                </div>
              </div>
              <button
                className="btn btn-primary form-submit"
                disabled={loading}
              >
                {loading ? "Adding demo request…" : "Request appointment"}{" "}
                <Icon name="arrow-right" />
              </button>
            </form>
          </div>
        );
      }
      function Login({ onBack, onLogin, notify }) {

        const [password, setPassword] = useState("admin123");
        const [show, setShow] = useState(false);
        const [loading, setLoading] = useState(false);
        useIcons(show);
        const submit = async (e) => {
          e.preventDefault();
          setLoading(true);
          const r = await MockAPI.login(email, password);
          setLoading(false);
          if (r.data) {
            notify("Welcome back, " + r.data.name);
            onLogin(r.data);
          } else notify("Invalid demo credentials");
        };
        return (
          <div className="login-screen">

              <button className="round-btn back-site" onClick={onBack} aria-label="Back to website">
                <Icon name="arrow-left" />

                <p className="sub">
                  Sign in to manage your hospital website and appointments.

                <div className="field">
                  <label htmlFor="login-email">Email address</label>
                  <input
                    id="login-email"
                    autoComplete="username"
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}

                <div className="field">

                  <div className="password-wrap">
                    <input
                      id="login-password"

                    <button type="button" aria-label={show ? "Hide password" : "Show password"} onClick={() => setShow(!show)}>
                      <Icon name={show ? "eye-off" : "eye"} />
                    </button>
                  </div>
                </div>
                <p style={{ fontSize: 11 }}>Demo only · Session ends on refresh · Never enter real patient data.</p>
                <button className="btn btn-dark form-submit" disabled={loading}>
                  {loading ? "Authenticating…" : "Sign in to dashboard"}{" "}
                  <Icon name="arrow-right" />
                </button>
                <div className="demo-note">
                  <strong>Choose a demo workspace</strong>
                  {demoAccounts.map((account) => <button type="button" className="demo-account" aria-pressed={email === account.email && password === account.password} key={account.role} onClick={() => { setEmail(account.email); setPassword(account.password); }}><strong>{account.label}</strong><span>{account.email} · {account.password}</span></button>)}
                </div>
              </form>
            </section>
          </div>
        );
      }

      function cleanHTML(value) {
        const parsed = new DOMParser().parseFromString(value || "", "text/html");
        const allowed = new Set([
          "P",
          "BR",
          "STRONG",
          "B",
          "EM",
          "I",
          "U",
          "H2",
          "H3",
          "UL",
          "OL",
          "LI",
          "BLOCKQUOTE",
          "A",
        ]);
        const clean = (parent) =>
          Array.from(parent.childNodes).forEach((node) => {
            if (node.nodeType === 8) {
              node.remove();
              return;
            }
            if (node.nodeType !== 1) return;
            if (
              [
                "SCRIPT",
                "STYLE",
                "IFRAME",
                "OBJECT",
                "SVG",
                "MATH",
                "FORM",
                "INPUT",
                "IMG",
              ].includes(node.tagName)
            ) {
              node.remove();
              return;
            }
            clean(node);
            if (
              node.tagName === "DIV" &&
              !node.querySelector("p,h2,h3,ul,ol,blockquote")
            ) {
              const paragraph = parsed.createElement("p");
              paragraph.append(...node.childNodes);
              node.replaceWith(paragraph);
              return;
            }
            if (!allowed.has(node.tagName)) {
              node.replaceWith(...node.childNodes);
              return;
            }
            const href = node.tagName === "A"
              ? safeURL(node.getAttribute("href"))
              : "";
            Array.from(node.attributes).forEach((attribute) =>
              node.removeAttribute(attribute.name)
            );
            if (href) {
              node.setAttribute("href", href);
              node.setAttribute("rel", "noopener noreferrer");
            }
          });
        clean(parsed.body);
        return parsed.body.innerHTML;

      async function readImage(file) {
        if (
          !["image/jpeg", "image/png", "image/webp", "image/avif"].includes(
            file.type,
          ) || file.size > 12 * 1024 * 1024
        ) throw new Error("Choose a JPG, PNG, WebP or AVIF image under 12 MB.");
        const bitmap = await createImageBitmap(file);
        if (bitmap.width * bitmap.height > 50000000) {
          bitmap.close();
          throw new Error(
            "Image dimensions are too large. Resize below 50 megapixels.",
          );
        }
        const ratio = Math.min(1, 1600 / bitmap.width, 1600 / bitmap.height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * ratio);
        canvas.height = Math.round(bitmap.height * ratio);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        const src = canvas.toDataURL("image/webp", 0.78);
        if (src.length > 650000) {
          throw new Error(
            "Compressed image is still too large. Use a smaller image (target below 450 KB).",
          );
        }
        return {
          ...mediaSeed(src),
          width: canvas.width,
          height: canvas.height,
          filename: file.name,
        };
      }

                    type="file"
                    accept="image/jpeg,image/png,image/webp,image/avif"
                    disabled={busy}
                    onChange={async (event) => {
                      const file = event.target.files[0];
                      if (!file) return;
                      setBusy(true);
                      try {
                        const image = await readImage(file);

      function RichEditor({ value, onChange }) {
        const editor = useRef(null);
        const selection = useRef(null);
        const [preview, setPreview] = useState(false);
        useEffect(() => {
          if (!preview && editor.current) editor.current.innerHTML = cleanHTML(value);
        }, [preview]);
        const remember = () => {
          const current = window.getSelection();
          if (current.rangeCount && editor.current?.contains(current.anchorNode)) {
            selection.current = current.getRangeAt(0).cloneRange();
          }
        };
        const command = (name, argument) => {
          editor.current?.focus();
          if (
            selection.current &&
            editor.current?.contains(selection.current.startContainer)
          ) {
            const current = window.getSelection();
            current.removeAllRanges();
            current.addRange(selection.current);
          }
          document.execCommand(name, false, argument);
          onChange(cleanHTML(editor.current.innerHTML));
          remember();
        };
        return (
          <div>
            <div
              className="rich-toolbar"
              role="toolbar"
              aria-label="Article formatting"
            >
              {[
                ["B", "bold"],
                ["I", "italic"],
                ["U", "underline"],
                ["H2", "formatBlock", "h2"],
                ["H3", "formatBlock", "h3"],
                ["¶", "formatBlock", "p"],
                ["• List", "insertUnorderedList"],
                ["1. List", "insertOrderedList"],
                ["Quote", "formatBlock", "blockquote"],
                ["Undo", "undo"],
                ["Redo", "redo"],
              ].map(([label, name, argument]) => (
                <button
                  type="button"
                  key={label}
                  aria-label={label}
                  disabled={preview}
                  onMouseDown={(event) => event.preventDefault()}
                  onClick={() => command(name, argument)}
                >
                  {label}
                </button>
              ))}
              <button
                type="button"
                disabled={preview}
                onMouseDown={(event) => event.preventDefault()}
                onClick={() => {
                  const href = prompt("Link URL (HTTPS only)");
                  if (href && safeURL(href)) command("createLink", safeURL(href));
                }}
              >
                Link
              </button>
              <button
                type="button"
                aria-pressed={preview}
                onClick={() => setPreview(!preview)}
              >
                {preview ? "Edit content" : "Preview"}
              </button>
            </div>
            {preview
              ? (
                <div
                  className="rich-surface article-body"
                  dangerouslySetInnerHTML={{ __html: cleanHTML(value) }}
                />
              )
              : (
                <div
                  ref={editor}
                  className="rich-surface"
                  role="textbox"
                  aria-label="Blog article content"
                  aria-multiline="true"

                  suppressContentEditableWarning
                  onKeyUp={remember}
                  onMouseUp={remember}
                  onInput={() => {
                    onChange(cleanHTML(editor.current.innerHTML));
                    remember();

                  onPaste={(event) => {
                    event.preventDefault();
                    const text = event.clipboardData.getData("text/plain");
                    const escaped = document.createElement("div");
                    escaped.textContent = text;
                    command("insertHTML", escaped.innerHTML.replace(/\n/g, "<br>"));
                  }}
                  onDrop={(event) => event.preventDefault()}
                />
              )}
          </div>
        );
      }
      function Gallery({ items }) {
        const [index, setIndex] = useState(0);
        const [paused, setPaused] = useState(() =>
          matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        const [hovered, setHovered] = useState(false);
        const selected = Math.min(index, items.length - 1);
        useEffect(() => {
          if (items.length < 2 || paused || hovered) return;
          const timer = setTimeout(
            () => setIndex((current) => (current + 1) % items.length),
            Math.max(2, Math.min(30, Number(items[selected]?.seconds) || 5)) * 1000,
          );
          return () => clearTimeout(timer);
        }, [selected, items, paused, hovered]);
        if (!items.length) return null;
        const item = items[selected];
        return (
          <div
            className="blog-gallery"
            aria-label="Article images"
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
            onFocus={() => setHovered(true)}
            onBlur={(event) => {
              if (!event.currentTarget.contains(event.relatedTarget)) {setHovered(
                  false,
                );}
            }}
          >
            <img
              src={safeURL(item.src, true)}
              alt={item.alt}
              width={item.width || 1600}
              height={item.height || 800}
            />
            {items.length > 1 && (
              <div className="gallery-controls">
                <button
                  aria-label="Previous image"
                  onClick={() =>
                    setIndex((selected - 1 + items.length) % items.length)}
                >
                  ←
                </button>
                <span>{selected + 1} / {items.length}</span>
                <button
                  aria-label="Next image"
                  onClick={() => setIndex((selected + 1) % items.length)}
                >
                  →
                </button>
                <button onClick={() => setPaused(!paused)}>
                  {paused ? "Play slideshow" : "Pause slideshow"}
                </button>
              </div>
            )}
          </div>
        );
      }

      function articleErrors(article, doctors, articles) {
        const errors = [];
        if (
          !article.title.trim() || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(article.slug)
        ) errors.push("Add a title and a clean, lowercase slug.");
        if (
          articles.some((entry) =>
            entry.id !== article.id && entry.slug === article.slug &&
            entry.language === article.language
          )
        ) errors.push("This URL is already used by another article.");
        if (
          /(#1|\bbest\b|\bnumber one\b)/i.test(
            article.title + " " + article.titleOverride,
          )
        ) errors.push("Remove unsupported superiority claims from the title.");
        if (
          !article.excerpt.trim() ||
          !cleanHTML(article.html).replace(/<[^>]*>/g, "").trim()
        ) errors.push("Add a summary and article content.");
        if (!article.author.trim() || !article.specialty.trim()) {
          errors.push("Set an author and clinical specialty.");
        }
        const reviewer = doctors.find((doctor) =>
          doctor.id === article.reviewer && doctor.verified && doctor.registration &&
          doctor.role?.trim().toLowerCase() === article.specialty.trim().toLowerCase()
        );
        if (!reviewer) {
          errors.push(
            "Choose a verified, registered reviewer whose specialty matches the article.",
          );
        }
        if (
          !/^\d{4}-\d{2}-\d{2}$/.test(article.reviewedAt) ||
          article.reviewedAt > new Date().toISOString().slice(0, 10)
        ) errors.push("Set a valid, non-future clinical review date.");
        if (
          !article.references.trim() ||
          article.references.split("\n").some((reference) =>
            !safeURL(reference.trim())
          )
        ) errors.push("Add evidence references as HTTPS URLs, one per line.");
        if (
          !article.images.length || article.images.some((image) =>
            !safeURL(image.src, true) || !image.alt?.trim() || !image.consent ||
            !image.genuine
          )
        ) {
          errors.push(
            "Add original images with alt text and rights / consent confirmation.",
          );
        }
        if (
          article.language === "te-IN" &&
          (!article.translationReviewer.trim() || !articles.some((entry) =>
            entry.id === article.translationOf && entry.language === "en-IN" &&
            entry.status === "published"
          ))
        ) {
          errors.push(
            "Telugu needs a published English source and a named human translation reviewer.",
          );
        }
        if (
          article.language === "te-IN" && articles.some((entry) =>
            entry.id !== article.id && entry.language === "te-IN" &&
            entry.translationOf === article.translationOf &&
            entry.status === "published"
          )
        ) {
          errors.push(
            "This English article already has a published Telugu translation.",
          );
        }
        return errors;

      function factErrors(facts) {
        const missing = [
          "name",
          "street",
          "city",
          "state",
          "pin",
          "phone",
          "map",
          "hours",
          "hoursSpec",
          "services",
          "origin",
          "consultations",
          "emergencyHours",
          "entrance",
          "parking",
          "accessibility",
          "landmarks",
          "railway",
          "differentiator",
        ].filter((key) => !String(facts[key] || "").trim());
        const issues = missing.length
          ? ["Complete verified fields: " + missing.join(", ")]
          : [];
        if (!/^\d{6}$/.test(facts.pin)) issues.push("PIN must contain six digits.");
        if (!/^\+91[\d\s-]{10,14}$/.test(facts.phone)) {
          issues.push("Enter an Indian phone with +91 country code.");
        }
        if (!safeURL(facts.map)) issues.push("Provide an HTTPS map-pin URL.");
        try {
          const origin = new URL(facts.origin);
          if (
            origin.protocol !== "https:" || origin.pathname !== "/" ||
            origin.search || origin.hash || origin.username || origin.password
          ) throw new Error();
        } catch {
          issues.push(
            "Production origin must be one HTTPS hostname, without a path or query.",
          );
        }
        if (
          facts.latitude === "" || facts.longitude === "" ||
          !Number.isFinite(Number(facts.latitude)) ||
          !Number.isFinite(Number(facts.longitude)) ||
          Math.abs(Number(facts.latitude)) > 90 ||
          Math.abs(Number(facts.longitude)) > 180
        ) issues.push("Enter verified latitude and longitude.");
        const days = "Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday";
        const hoursPattern = new RegExp(
          "^(" + days + ")(,(" + days +
            "))* ([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$",
        );
        if (
          facts.hoursSpec.split("\n").some((line) => !hoursPattern.test(line.trim()))
        ) {
          issues.push(
            "Use opening-hours rows like Monday,Tuesday 09:00-17:00. All-day availability: 00:00-23:59.",
          );
        }
        if (
          facts.profiles &&
          facts.profiles.split("\n").some((line) => !safeURL(line.trim()))
        ) issues.push("Official profiles must be HTTPS URLs, one per line.");
        return issues;
      }

      const serviceTemplates = [

        ["Newborn Care", "pediatrics/newborn-care/", "pediatrics/"],
        ["Vaccination", "pediatrics/vaccination/", "pediatrics/"],

      function serviceErrors(page, cms, doctors) {
        const issues = [];
        if (
          !/^(fertility|womens-health|pediatrics)\/(?:[a-z0-9]+(?:-[a-z0-9]+)*\/)?$/
            .test(page.slug || "")
        ) issues.push("Use a clean service-hub URL ending in a slash.");
        if (
          !page.available ||
          !cms.facts.services.split("\n").map((item) => item.trim().toLowerCase())
            .includes(page.title?.trim().toLowerCase())
        ) {
          issues.push(
            "Management must list this exact offered service in the hospital facts and confirm availability.",
          );
        }
        [
          "title",
          "summary",
          "pathway",
          "risks",
          "alternatives",
          "fees",
          "author",
          "references",
          "reviewedAt",
        ].forEach((key) => {
          if (!page[key]?.trim()) issues.push("Complete " + key + ".");
        });
        const clinician = doctors.find((doctor) =>
          doctor.id === page.clinician && doctor.verified && doctor.registration
        );
        const reviewer = doctors.find((doctor) =>
          doctor.id === page.reviewer && doctor.verified && doctor.registration
        );
        if (!clinician || !reviewer || clinician.role !== reviewer.role) {
          issues.push(
            "Select a treating clinician and registered reviewer with matching verified specialties.",
          );
        }
        if (page.reviewedAt > new Date().toISOString().slice(0, 10)) {
          issues.push("Review date cannot be in the future.");
        }
        if (
          /(#1|\bbest\b|\bnumber one\b)/i.test(
            (page.title || "") + " " + (page.titleOverride || ""),
          )
        ) issues.push("Remove unsupported superiority claims.");
        if (
          (page.references || "").split("\n").some((value) => !safeURL(value.trim()))
        ) issues.push("References must be HTTPS URLs, one per line.");
        if (
          page.outcomes &&
          [
            "outcomePeriod",
            "outcomeDenominator",
            "outcomeAges",
            "outcomeDefinition",
            "outcomeSource",
          ].some((key) => !page[key]?.trim())
        ) {
          issues.push(
            "Outcomes need period, denominator, age groups, definition and verification source.",
          );
        }
        if (
          cms.pages.some((entry) => entry.id !== page.id && entry.slug === page.slug)
        ) issues.push("Another service page already uses this canonical URL.");
        return issues;
      }

        anchor.download = "hospital-content.json";
        anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

          notify("Verified content exported. Build and validate before deployment.");
        };
        return (
          <div className="admin-stack">

              <div className="editor-toolbar">
                <div>
                  <h3>Clinical publishing & release readiness</h3>
                  <small className="muted">
                    Evidence before indexing · No unsupported “best” pages
                  </small>
                </div>
                <button className="btn btn-dark" onClick={exportContent}>
                  Export verified content
                </button>
              </div>
              <div className="admin-notice warning">
                This single-file demo uses hash navigation and browser storage, not
                secure authentication or server rendering. The included static
                generator produces clean-URL HTML, JSON-LD and sitemaps from approved
                exports. Hosting redirects, TLS, real authentication, Search Console
                and field performance must be verified during deployment.
              </div>
              <div className="admin-row">
                <span className="status pending">
                  Facts: {cms.facts.approvedAt ? "Approved" : "Awaiting management"}
                </span>
                <span className="admin-count">
                  {cms.pages.filter((entry) => entry.status === "published").length}
                  {" "}
                  service pages ready
                </span>
                <span className="admin-count">
                  {blogs.filter((entry) => entry.status === "published").length}{" "}
                  articles
                </span>
              </div>
              {issues.length > 0 && (
                <div
                  className="admin-notice warning"
                  role="alert"
                  style={{ marginTop: 16 }}
                >
                  <ul>
                    {issues.map((issue, index) => <li key={index}>{issue}</li>)}
                  </ul>
                </div>
              )}
            </section>
            <div className="blog-workspace">
              <aside className="editor-card">
                <h3>Service hubs & subpages</h3>
                <p style={{ fontSize: 12 }}>
                  Templates are drafts, not claims of availability. IVF searches map
                  to fertility/ivf-khammam/; baby-care searches map to pediatrics/.
                </p>
                {cms.pages.map((entry) => (
                  <button
                    key={entry.id}
                    className="blog-record"
                    onClick={() => select({ ...entry })}
                  >
                    <strong>{entry.title}</strong>
                    <small>{entry.status} · {entry.slug}</small>
                  </button>
                ))}
                <Field
                  label="Create from service template"
                  value=""
                  options={[
                    { value: "", label: "+ Select a template" },
                    ...serviceTemplates.filter((template) =>
                      !cms.pages.some((entry) => entry.slug === template[1])
                    ).map((template) => ({ value: template[1], label: template[0] })),
                  ]}
                  onChange={(slug) => {
                    const template = serviceTemplates.find((entry) =>
                      entry[1] === slug
                    );
                    if (template) {
                      select({
                        id: uid(),
                        title: template[0],
                        slug,
                        hub: template[2],
                        status: "draft",
                        available: false,
                        summary: "",
                        pathway: "",
                        risks: "",
                        alternatives: "",
                        fees: "",
                        author: "",
                        reviewer: "",
                        clinician: "",
                        reviewedAt: "",
                        references: "",
                      });
                    }
                  }}
                />
              </aside>
              <section className="editor-card">
                {!page
                  ? (
                    <>
                      <h3>Build complete, useful service pages</h3>
                      <p>
                        Select a template. Add the actual pathway, risks, alternatives
                        and INR fee inclusions; link the treating clinician and
                        document clinical review before publishing.
                      </p>
                    </>
                  )
                  : (
                    <>
                      <div className="editor-toolbar">
                        <h3>{page.title}</h3>
                        <div className="admin-row">
                          <button
                            className="tiny-btn"
                            onClick={() => {
                              if (
                                !confirm(
                                  "Delete this service page? Redirect replaced production URLs before deployment.",
                                )
                              ) return;
                              const next = {
                                ...cms,
                                pages: cms.pages.filter((entry) =>
                                  entry.id !== page.id
                                ),
                              };
                              if (saveStore("sreemantha-cms", next, notify)) {
                                setCms(next);
                                setPage(null);
                                setDirty(false);
                              }
                            }}
                          >
                            Delete
                          </button>
                          <button className="btn" onClick={() => save(false)}>
                            Save draft
                          </button>
                          <button className="btn btn-dark" onClick={() => save(true)}>
                            Approve page
                          </button>
                        </div>
                      </div>
                      <Check
                        label="This service is actually available at this hospital"
                        value={page.available}
                        onChange={(value) => update("available", value)}
                      />
                      {[
                        ["title", "Service name"],
                        ["slug", "Canonical path"],
                        ["summary", "Introduction"],
                        ["pathway", "Treatment pathway / process"],
                        ["risks", "Risks and limitations"],
                        ["alternatives", "Alternatives"],
                        ["fees", "INR fees, inclusions and exclusions"],
                        ["author", "Author full name"],
                        ["references", "Evidence reference URLs, one per line"],
                        ["titleOverride", "Optional title override"],
                        ["description", "Optional meta description"],
                      ].map(([key, label]) => (
                        <Field
                          key={key}
                          label={label}
                          value={page[key]}
                          type={["title", "slug", "author", "titleOverride"].includes(
                              key,
                            )
                            ? "text"
                            : "textarea"}
                          onChange={(value) => update(key, value)}
                        />
                      ))}
                      {[["clinician", "Treating clinician"], [
                        "reviewer",
                        "Specialty reviewer",
                      ]].map(([key, label]) => (
                        <Field
                          key={key}
                          label={label}
                          options={[
                            { value: "", label: "Choose verified clinician" },
                            ...doctors.filter((doctor) => doctor.verified).map((
                              doctor,
                            ) => ({
                              value: doctor.id,
                              label: doctor.name + " · " + doctor.role,
                            })),
                          ]}
                          value={page[key]}
                          onChange={(value) => update(key, value)}
                        />
                      ))}
                      <Field
                        label="Clinical review date"
                        type="date"
                        max={new Date().toISOString().slice(0, 10)}
                        value={page.reviewedAt}
                        onChange={(value) => update("reviewedAt", value)}
                      />
                      <details className="admin-section">
                        <summary>IVF outcomes (leave blank unless verified)</summary>
                        {[
                          ["outcomes", "Outcome statement"],
                          ["outcomePeriod", "Measurement period"],
                          ["outcomeDenominator", "Denominator / sample size"],
                          ["outcomeAges", "Age groups"],
                          ["outcomeDefinition", "Outcome definition"],
                          ["outcomeSource", "Verification source"],
                        ].map(([key, label]) => (
                          <Field
                            key={key}
                            label={label}
                            value={page[key]}
                            onChange={(value) => update(key, value)}
                          />
                        ))}
                      </details>
                      <div className="cms-preview" style={{ maxWidth: 390 }}>
                        <small>MOBILE SEARCH PREVIEW</small>
                        <h3>
                          {page.titleOverride ||
                            page.title + " in Khammam | Sreemantha Hospital"}
                        </h3>
                        <p>
                          {page.description ||
                            `${page.title} in Khammam. ${cms.facts.differentiator} Contact us for an appointment.`}
                        </p>
                      </div>
                    </>
                  )}
              </section>
            </div>
            <section className="editor-card">
              <h3>Ownership & editorial policies</h3>
              <Field
                label="Legacy URL redirects (old-path/ => canonical-path/, one per line)"
                type="textarea"
                value={redirectRules}
                onChange={setRedirectRules}
              />
              <p style={{ fontSize: 12 }}>
                The generator validates single-hop targets and emits Netlify-style
                redirect rules. Configure HTTPS and alternate hostnames at your host;
                these rules are not live until deployed.
              </p>
              {[
                ["owner", "Website owner / responsible organization"],
                ["editorial", "Clinical editorial and review policy"],
                ["corrections", "Corrections policy and contact"],
                ["privacy", "Privacy, retention and booking-data policy"],
              ].map(([key, label]) => (
                <Field
                  key={key}
                  label={label}
                  type="textarea"
                  value={policies[key]}
                  onChange={(value) => setPolicies({ ...policies, [key]: value })}
                />
              ))}
              <button
                className="btn btn-dark"
                onClick={() => {
                  const next = {
                    ...cms,
                    policies,
                    redirectRules,
                    updatedAt: new Date().toISOString(),
                  };
                  if (saveStore("sreemantha-cms", next, notify)) {
                    setCms(next);
                    notify("Publishing policies saved.");
                  }
                }}
              >
                Save policies
              </button>
            </section>
            <section className="editor-card">
              <h3>Production release checklist — not yet verified</h3>
              <ul style={{ lineHeight: 2, fontSize: 13 }}>
                <li>
                  HTTPS, one hostname, trailing slashes and single-hop 301
                  replacements at the host.
                </li>
                <li>
                  Static generation and link / canonical / JSON-LD / sitemap
                  validation.
                </li>
                <li>
                  Schema.org Validator, applicable Rich Results Test and Search
                  Console ownership.
                </li>
                <li>
                  Mobile field p75: LCP ≤ 2.5 s, INP ≤ 200 ms, CLS ≤ 0.1; initial
                  transfer below 1 MB.
                </li>
                <li>
                  CDN caching, compression, low-end Android / 4G and real booking flow
                  tests.
                </li>
                <li>
                  Human-reviewed English / Telugu pairs with reciprocal hreflang;
                  never infer redirects.
                </li>
                <li>
                  Backend authentication, access controls and staging protection.
                  Never send form data to analytics.
                </li>
              </ul>
            </section>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
